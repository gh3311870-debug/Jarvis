<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>VFX LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a;
    --panel:rgba(9,13,18,0.88);
    --line:#16222e;
    --line2:#22323f;
    --cyan:#4ec9ff;
    --cyan-dim:#1c4a63;
    --amber:#ffb454;
    --ember:#ff7a3c;
    --green:#6ee7a8;
    --text:#dfe8ef;
    --muted:#65788a;
    --danger:#ff5f5f;
    --sheet-h:46vh;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:var(--bg); color:var(--text);
    font-family:'Rajdhani',system-ui,sans-serif;
    touch-action:none; overscroll-behavior:none;
    user-select:none; -webkit-user-select:none;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

  canvas#gl{position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0;}

  #ui{position:fixed; inset:0; z-index:2; pointer-events:none;
      padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  #ui > *{pointer-events:auto;}
  #ui.hidden > *:not(#toast):not(#hud){display:none;}

  /* ---------- top bar ---------- */
  #topbar{position:absolute; top:calc(env(safe-area-inset-top) + 10px); left:12px; right:12px;
          display:flex; align-items:center; gap:8px;}
  .brand{font-weight:700; letter-spacing:3px; font-size:13px; color:var(--cyan); white-space:nowrap;}
  .brand b{color:var(--amber); font-weight:700;}
  .brand span{color:var(--muted); font-weight:400; letter-spacing:1.5px; font-size:10px; display:block; margin-top:-3px;}
  .spacer{flex:1;}
  .btn{
    background:rgba(10,16,22,0.82); border:1px solid var(--line2); color:var(--text);
    height:34px; min-width:34px; padding:0 10px; border-radius:9px;
    font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:1px;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    backdrop-filter:blur(8px);
  }
  .btn:active{transform:scale(0.95);}
  .btn.on{border-color:var(--cyan); color:var(--cyan); background:rgba(78,201,255,0.14);}
  .btn.rec{border-color:var(--danger); color:var(--danger); background:rgba(255,95,95,0.14);}
  .btn.sm{height:28px; font-size:10px; padding:0 8px; min-width:28px;}
  .btn.ghost{background:rgba(10,16,22,0.5);}

  /* ---------- hud ---------- */
  #hud{position:absolute; top:calc(env(safe-area-inset-top) + 54px); left:12px;
       font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.55;
       color:var(--muted); letter-spacing:0.5px; pointer-events:none; text-shadow:0 1px 3px #000;}
  #hud .k{color:#3d4d5c;}
  #hud .v{color:var(--cyan);}
  #hud .w{color:var(--amber);}
  #hud b{color:var(--text); font-weight:500;}
  #graph{display:block; margin-top:4px; opacity:0.8;}

  /* ---------- preset rail ---------- */
  #presets{position:absolute; top:calc(env(safe-area-inset-top) + 50px); right:12px;
           display:flex; flex-direction:column; gap:5px; align-items:flex-end; max-height:56vh; overflow:auto;
           scrollbar-width:none;}
  #presets::-webkit-scrollbar{display:none;}
  .pbtn{
    background:rgba(10,16,22,0.72); border:1px solid var(--line); color:#9fb1c0;
    padding:5px 9px; border-radius:7px; font-family:'JetBrains Mono',monospace;
    font-size:10px; letter-spacing:0.5px; text-align:right; white-space:nowrap; backdrop-filter:blur(6px);
  }
  .pbtn.on{border-color:var(--amber); color:var(--amber); background:rgba(255,180,84,0.13);}

  /* ---------- tool cluster ---------- */
  #tools{position:absolute; left:12px; bottom:calc(env(safe-area-inset-bottom) + 14px);
         display:flex; flex-direction:column; gap:7px;}
  .tool{
    width:50px; height:50px; border-radius:13px;
    background:rgba(10,16,22,0.8); border:1px solid var(--line2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    color:#9fb1c0; backdrop-filter:blur(8px);
  }
  .tool i{font-size:17px; font-style:normal; line-height:1;}
  .tool u{font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:0.5px; text-decoration:none; opacity:0.75;}
  .tool.on{border-color:var(--ember); color:var(--amber); background:rgba(255,122,60,0.16);
           box-shadow:0 0 16px rgba(255,122,60,0.25);}
  .tool:active{transform:scale(0.94);}

  #playrow{position:absolute; right:12px; bottom:calc(env(safe-area-inset-bottom) + 14px);
           display:flex; gap:7px; align-items:center;}

  /* ---------- param sheet ---------- */
  #sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:5;
    background:var(--panel); border-top:1px solid var(--line2);
    border-radius:16px 16px 0 0; backdrop-filter:blur(14px);
    transform:translateY(102%); transition:transform .26s cubic-bezier(.3,.9,.3,1);
    max-height:min(var(--sheet-h), 520px); display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
    box-shadow:0 -20px 50px rgba(0,0,0,0.55);
  }
  #sheet.open{transform:translateY(0);}
  #sheetHead{display:flex; align-items:center; gap:6px; padding:8px 12px 6px; border-bottom:1px solid var(--line);}
  #tabs{display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none;}
  #tabs::-webkit-scrollbar{display:none;}
  .tab{
    background:none; border:1px solid transparent; color:var(--muted);
    font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:1px;
    padding:6px 9px; border-radius:7px; white-space:nowrap;
  }
  .tab.on{color:var(--cyan); border-color:var(--cyan-dim); background:rgba(78,201,255,0.1);}
  #sheetBody{overflow-y:auto; padding:10px 12px 16px; -webkit-overflow-scrolling:touch;}
  .grp{display:none;}
  .grp.on{display:block;}
  .gdesc{font-size:12px; color:var(--muted); line-height:1.45; margin:0 0 10px;}

  .ctrl{margin-bottom:11px;}
  .ctrl .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px;}
  .ctrl .nm{font-size:12px; letter-spacing:1.2px; color:#a9bcca; text-transform:uppercase;}
  .ctrl .vl{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--amber);}
  .ctrl .hint{font-size:11px; color:#4b5a68; line-height:1.35; margin-top:2px;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:22px; background:none; margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px; background:#1d2a36; border-radius:2px;}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; margin-top:-9px; border-radius:50%;
    background:var(--cyan); border:3px solid #0a1017; box-shadow:0 0 10px rgba(78,201,255,0.55);
  }
  input[type=range]::-moz-range-track{height:3px; background:#1d2a36; border-radius:2px;}
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%; background:var(--cyan); border:3px solid #0a1017;
  }
  .seg{display:flex; gap:4px; flex-wrap:wrap;}
  .seg button{
    flex:1; min-width:52px; background:#0c1219; border:1px solid var(--line); color:#90a3b2;
    padding:7px 4px; border-radius:7px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.5px;
  }
  .seg button.on{border-color:var(--cyan); color:var(--cyan); background:rgba(78,201,255,0.12);}
  .togg{display:flex; justify-content:space-between; align-items:center; padding:7px 0;}
  .sw{width:40px; height:22px; border-radius:11px; background:#16202a; border:1px solid var(--line2); position:relative;}
  .sw::after{content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%;
             background:#3d4d5c; transition:all .16s;}
  .sw.on{background:rgba(78,201,255,0.2); border-color:var(--cyan-dim);}
  .sw.on::after{left:20px; background:var(--cyan);}
  .rowbtns{display:flex; gap:6px; margin:6px 0 12px;}
  .rowbtns .btn{flex:1;}
  h4{margin:14px 0 7px; font-size:11px; letter-spacing:2px; color:var(--cyan); font-family:'JetBrains Mono',monospace;
     border-bottom:1px solid var(--line); padding-bottom:4px;}
  h4:first-child{margin-top:0;}

  /* ---------- director ---------- */
  #brief{
    position:absolute; left:50%; transform:translateX(-50%); top:calc(env(safe-area-inset-top) + 52px);
    width:min(92vw, 430px); background:var(--panel); border:1px solid var(--line2); border-radius:12px;
    padding:12px 14px; backdrop-filter:blur(12px); display:none;
  }
  #brief.show{display:block;}
  #brief .bt{font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:2px; color:var(--amber);}
  #brief h3{margin:3px 0 6px; font-size:17px; letter-spacing:1px;}
  #brief p{margin:0 0 9px; font-size:13px; color:#9fb1c0; line-height:1.4;}
  .goal{display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:12px;}
  .goal .gn{flex:1; color:#a9bcca; letter-spacing:0.5px;}
  .goal .gv{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); min-width:96px; text-align:right;}
  .bar{height:4px; border-radius:2px; background:#16202a; overflow:hidden; width:64px;}
  .bar i{display:block; height:100%; background:var(--danger); transition:width .2s, background .2s;}
  .goal.ok .bar i{background:var(--green);}
  .goal.ok .gv{color:var(--green);}
  #briefFoot{display:flex; gap:6px; align-items:center; margin-top:10px;}
  #score{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); flex:1;}
  #stars{color:var(--amber); letter-spacing:2px; font-size:14px;}

  /* ---------- toast + boot ---------- */
  #toast{position:absolute; left:50%; bottom:calc(env(safe-area-inset-bottom) + 78px); transform:translateX(-50%);
         background:rgba(6,10,14,0.92); border:1px solid var(--line2); color:var(--text);
         padding:8px 14px; border-radius:9px; font-family:'JetBrains Mono',monospace; font-size:11px;
         letter-spacing:0.5px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:86vw; text-align:center;}
  #toast.show{opacity:1;}
  #boot{position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; flex-direction:column;
        align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;}
  #boot.gone{display:none;}
  #boot .ring{width:46px; height:46px; border:2px solid var(--line2); border-top-color:var(--cyan);
              border-radius:50%; animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #bootMsg{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:2px; color:var(--muted);}
  #bootErr{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--danger); white-space:pre-wrap;
           text-align:left; max-width:min(92vw,620px); max-height:60vh; overflow:auto; line-height:1.5;
           border:1px solid #3a1c1c; background:#120a0a; padding:12px; border-radius:8px; display:none;}

  body.briefopen #presets{ display:none; }
  @media (max-width:540px){
    .brand span{ display:none; }
    .brand{ font-size:12px; letter-spacing:2px; }
    #btnDirector{ font-size:10px; padding:0 8px; }
    #hud{ top:calc(env(safe-area-inset-top) + 50px); }
  }
  @media (min-width:900px){
    body.briefopen #presets{ display:flex; top:calc(env(safe-area-inset-top) + 50px); }
    :root{--sheet-h:100vh;}
    #sheet{
      left:auto; right:0; top:0; bottom:0; width:352px; max-height:none;
      border-radius:0; border-top:none; border-left:1px solid var(--line2);
      transform:translateX(102%);
    }
    #sheet.open{transform:translateX(0);}
    #sheetHead{padding-top:calc(env(safe-area-inset-top) + 12px);}
    #presets{right:12px;}
    body.panelopen #presets{right:364px;}
    body.panelopen #playrow{right:364px;}
    body.panelopen #topbar{right:364px;}
    #tools{gap:9px;}
    .tool{width:54px; height:54px;}
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="ui">
  <div id="topbar">
    <div class="brand">VFX<b>LAB</b><span>REALTIME SIMULATION BENCH</span></div>
    <div class="spacer"></div>
    <button class="btn" id="btnDirector" title="Director mode">DIRECTOR</button>
    <button class="btn" id="btnShot" title="Save PNG">◙</button>
    <button class="btn" id="btnRec" title="Record WebM">●</button>
    <button class="btn" id="btnPanel" title="Parameters">≡</button>
  </div>

  <div id="hud" class="mono"></div>

  <div id="presets"></div>

  <div id="tools">
    <button class="tool on" data-tool="ignite"><i>🔥</i><u>IGNITE</u></button>
    <button class="tool" data-tool="blast"><i>✸</i><u>BLAST</u></button>
    <button class="tool" data-tool="wind"><i>💨</i><u>WIND</u></button>
    <button class="tool" data-tool="vortex"><i>🌀</i><u>VORTEX</u></button>
    <button class="tool" data-tool="cool"><i>❄</i><u>QUENCH</u></button>
  </div>

  <div id="playrow">
    <button class="btn" id="btnStep" title="Step one frame">▸|</button>
    <button class="btn" id="btnPause" title="Pause">❙❙</button>
    <button class="btn" id="btnReset" title="Reset fields">↺</button>
  </div>

  <div id="brief">
    <div class="bt" id="briefTag">SHOT 01 / BRIEF</div>
    <h3 id="briefName">—</h3>
    <p id="briefText">—</p>
    <div id="goals"></div>
    <div id="briefFoot">
      <div id="score">AWAITING TAKE</div>
      <div id="stars"></div>
      <button class="btn sm" id="btnTake">TAKE</button>
      <button class="btn sm" id="btnNextShot">NEXT ▸</button>
      <button class="btn sm ghost" id="btnCloseBrief">✕</button>
    </div>
  </div>

  <div id="sheet">
    <div id="sheetHead">
      <div id="tabs"></div>
      <button class="btn sm ghost" id="btnSheetClose">✕</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div id="toast" class="mono"></div>
</div>

<div id="boot">
  <div class="ring" id="bootRing"></div>
  <div id="bootMsg" class="mono">COMPILING SOLVER…</div>
  <pre id="bootErr"></pre>
</div>

<script>
"use strict";
/* ==========================================================================
   VFX LAB — realtime volumetric combustion / fluid / particle bench
   Single file. WebGL2. Everything below is hand-rolled: a semi-Lagrangian
   Navier-Stokes solver on a flattened 3D atlas, a light-transmittance volume,
   a raymarched single-scattering volume renderer with blackbody emission,
   an SDF set, GPU particles coupled to the fluid, and an HDR post chain.
   ========================================================================== */

const $ = s => document.querySelector(s);
const canvas = $('#gl');
const bootEl = $('#boot'), bootMsg = $('#bootMsg'), bootErr = $('#bootErr');

function fatal(msg){
  bootEl.classList.remove('gone');
  $('#bootRing').style.display = 'none';
  bootMsg.textContent = 'INITIALISATION FAILED';
  bootErr.style.display = 'block';
  bootErr.textContent = msg;
  console.error(msg);
}

const gl = canvas.getContext('webgl2', {
  antialias:false, alpha:false, depth:false, stencil:false,
  premultipliedAlpha:false, preserveDrawingBuffer:true,
  powerPreference:'high-performance', desynchronized:true
});
if(!gl){ fatal('WebGL2 is not available in this browser.\nThe simulation needs WebGL2 (float render targets, MRT).'); throw new Error('no webgl2'); }

const EXT = {
  colorFloat: gl.getExtension('EXT_color_buffer_float'),
  floatLinear: gl.getExtension('OES_texture_float_linear'),
  halfLinear: true,
  aniso: gl.getExtension('EXT_texture_filter_anisotropic'),
  dbg: gl.getExtension('WEBGL_debug_renderer_info')
};
if(!EXT.colorFloat){ fatal('EXT_color_buffer_float missing — cannot render to float buffers.'); throw new Error('no float rt'); }
const RENDERER = EXT.dbg ? gl.getParameter(EXT.dbg.UNMASKED_RENDERER_WEBGL) : 'unknown';
const MAX_TEX = gl.getParameter(gl.MAX_TEXTURE_SIZE);

/* ---------------------------------------------------------------- utils --- */
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp  = (a,b,t)=>a+(b-a)*t;
const smoothstep = (e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const rnd = (a=1,b=0)=>b+Math.random()*(a-b);
const nowMs = ()=>performance.now();

function v3(x=0,y=0,z=0){ return new Float32Array([x,y,z]); }
function v3set(o,x,y,z){ o[0]=x; o[1]=y; o[2]=z; return o; }
function v3add(o,a,b){ o[0]=a[0]+b[0]; o[1]=a[1]+b[1]; o[2]=a[2]+b[2]; return o; }
function v3sub(o,a,b){ o[0]=a[0]-b[0]; o[1]=a[1]-b[1]; o[2]=a[2]-b[2]; return o; }
function v3scale(o,a,s){ o[0]=a[0]*s; o[1]=a[1]*s; o[2]=a[2]*s; return o; }
function v3dot(a,b){ return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function v3len(a){ return Math.hypot(a[0],a[1],a[2]); }
function v3norm(o,a){ const l=v3len(a)||1; return v3scale(o,a,1/l); }
function v3cross(o,a,b){
  const x=a[1]*b[2]-a[2]*b[1], y=a[2]*b[0]-a[0]*b[2], z=a[0]*b[1]-a[1]*b[0];
  o[0]=x; o[1]=y; o[2]=z; return o;
}

/* --------------------------------------------------------------- shaders --- */
const VS_QUAD = `#version 300 es
out vec2 vUV;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
  vUV = p * 0.5;
  gl_Position = vec4(p - 1.0, 0.0, 1.0);
}`;

const GLSL_HEAD = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
#define PI 3.14159265359
#define TAU 6.28318530718
#define saturate(x) clamp(x, 0.0, 1.0)
`;

/* value noise + hashes (Dave Hoskins style) */
const GLSL_NOISE = `
float hash11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
vec2 hash21(float p){ vec3 p3 = fract(vec3(p)*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float hash13(vec3 p3){ p3 = fract(p3*.1031); p3 += dot(p3, p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
vec3 hash33(vec3 p3){ p3 = fract(p3*vec3(.1031,.1030,.0973)); p3 += dot(p3, p3.yxz+33.33); return fract((p3.xxy+p3.yxx)*p3.zyx); }
float vnoise(vec3 x){
  vec3 i = floor(x), f = fract(x);
  f = f*f*(3.0-2.0*f);
  float n000 = hash13(i+vec3(0,0,0)), n100 = hash13(i+vec3(1,0,0));
  float n010 = hash13(i+vec3(0,1,0)), n110 = hash13(i+vec3(1,1,0));
  float n001 = hash13(i+vec3(0,0,1)), n101 = hash13(i+vec3(1,0,1));
  float n011 = hash13(i+vec3(0,1,1)), n111 = hash13(i+vec3(1,1,1));
  return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
             mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
}
float fbm3(vec3 p, int oct){
  float a = 0.5, s = 0.0, n = 0.0;
  for(int i=0;i<6;i++){
    if(i>=oct) break;
    s += a; n += a*vnoise(p); p *= 2.03; p += vec3(11.3, 7.7, 5.1); a *= 0.5;
  }
  return n/max(s,1e-4);
}
float fbm2(vec2 p, int oct){ return fbm3(vec3(p, 3.7), oct); }
// interleaved gradient noise — cheap per-pixel dither / raymarch jitter
float ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056, 0.00583715)))); }
`;

/* 3D field packed as a 2D atlas of Z slices. All sim shaders share this. */
const GLSL_GRID = `
uniform vec3 uGrid;    // GX, GY, GZ
uniform vec2 uTiles;   // atlas columns, rows
uniform vec2 uAtlas;   // atlas size in pixels

// voxel index (cell corner, integer) of the fragment being written
vec3 fragVoxel(){
  vec2 px = floor(gl_FragCoord.xy);
  vec2 t  = floor(px / uGrid.xy);
  vec2 inT = px - t * uGrid.xy;
  return vec3(inT, t.y * uTiles.x + t.x);
}
// uv of a point inside slice sl (xy given in continuous voxel units)
vec2 atlasUV(vec2 xy, float sl){
  float s = clamp(floor(sl + 0.5), 0.0, uGrid.z - 1.0);
  vec2 tile = vec2(mod(s, uTiles.x), floor(s / uTiles.x));
  vec2 p = clamp(xy, vec2(0.5), uGrid.xy - 0.5);   // stay inside the tile
  return (tile * uGrid.xy + p) / uAtlas;
}
// trilinear sample; p in continuous voxel space, cell centres at i+0.5
vec4 tex3D(sampler2D T, vec3 p){
  vec3 c = clamp(p, vec3(0.5), uGrid - 0.5);
  float z = c.z - 0.5;
  float z0 = floor(z), f = z - z0;
  vec4 a = texture(T, atlasUV(c.xy, z0));
  vec4 b = texture(T, atlasUV(c.xy, min(z0 + 1.0, uGrid.z - 1.0)));
  return mix(a, b, f);
}
vec4 tex3Dn(sampler2D T, vec3 p01){ return tex3D(T, p01 * uGrid); }
// nearest neighbour fetch by integer voxel
vec4 fetch3D(sampler2D T, vec3 iv){
  vec3 c = clamp(iv, vec3(0.0), uGrid - 1.0);
  vec2 tile = vec2(mod(c.z, uTiles.x), floor(c.z / uTiles.x));
  return texelFetch(T, ivec2(tile * uGrid.xy + floor(c.xy) + 0.5), 0);
}
bool outside(vec3 iv){
  return iv.x < 0.0 || iv.y < 0.0 || iv.z < 0.0 ||
         iv.x > uGrid.x-1.0 || iv.y > uGrid.y-1.0 || iv.z > uGrid.z-1.0;
}
// solid boundary: closed box, open lid
bool isWall(vec3 iv){
  return iv.x < 1.0 || iv.z < 1.0 || iv.y < 1.0 ||
         iv.x > uGrid.x-2.0 || iv.z > uGrid.z-2.0;
}
`;

/* -------------------------------------------------------- program builder --- */
let shaderLog = [];
function compile(type, src, name){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s) || '';
    const lines = src.split('\n');
    let ann = '';
    // annotate the offending lines
    const re = /:(\d+):(\d+):/g; let m;
    const nums = new Set();
    (log.match(/\d+:(\d+)/g) || []).forEach(t => nums.add(parseInt(t.split(':')[1],10)));
    nums.forEach(n => { for(let i=n-2;i<=n+1;i++) if(lines[i-1]!==undefined) ann += String(i).padStart(4)+' | '+lines[i-1]+'\n'; });
    const msg = `[${name}] ${type===gl.VERTEX_SHADER?'vertex':'fragment'} shader:\n${log}\n${ann}`;
    shaderLog.push(msg);
    throw new Error(msg);
  }
  return s;
}
function buildProgram(name, fsBody, opts){
  opts = opts || {};
  const defs = (opts.defines||[]).map(d=>'#define '+d+'\n').join('');
  const fs = GLSL_HEAD + defs + (opts.noise!==false ? GLSL_NOISE : '') + (opts.grid ? GLSL_GRID : '') + fsBody;
  const vsSrc = opts.vs || VS_QUAD;
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc, name));
  gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs, name));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)){
    const msg = `[${name}] link error:\n${gl.getProgramInfoLog(p)}`;
    shaderLog.push(msg); throw new Error(msg);
  }
  // cache uniform locations lazily
  const loc = {};
  const wrapper = {
    prog:p, name,
    u(n){ if(!(n in loc)) loc[n] = gl.getUniformLocation(p, n); return loc[n]; },
    use(){ gl.useProgram(p); return wrapper; }
  };
  return wrapper;
}

/* ------------------------------------------------------------- textures --- */
function texture2D(w, h, internal, filter, wrap){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texStorage2D(gl.TEXTURE_2D, 1, internal, w, h);
  const f = filter || gl.LINEAR;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, f);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, f);
  const wr = wrap || gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wr);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wr);
  t._w = w; t._h = h; t._fmt = internal;
  return t;
}
function framebuffer(textures){
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  const atts = [];
  textures.forEach((t,i)=>{
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0+i, gl.TEXTURE_2D, t, 0);
    atts.push(gl.COLOR_ATTACHMENT0+i);
  });
  gl.drawBuffers(atts);
  const st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  if(st !== gl.FRAMEBUFFER_COMPLETE) throw new Error('incomplete framebuffer 0x'+st.toString(16));
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  fb._tex = textures;
  fb._w = textures[0]._w; fb._h = textures[0]._h;
  return fb;
}
/** render target: one or more float textures + fbo, with optional ping-pong */
function makeRT(w, h, internal, filter, count){
  const texs = [];
  for(let i=0;i<(count||1);i++) texs.push(texture2D(w, h, internal, filter));
  return { fbo: framebuffer(texs), tex: texs[0], texs, w, h };
}
function makePing(w, h, internal, filter, count){
  const a = makeRT(w,h,internal,filter,count), b = makeRT(w,h,internal,filter,count);
  return {
    w, h, read:a, write:b,
    swap(){ const t=this.read; this.read=this.write; this.write=t; }
  };
}
function bindRT(rt){
  gl.bindFramebuffer(gl.FRAMEBUFFER, rt.fbo);
  gl.viewport(0,0,rt.w,rt.h);
}
function bindScreen(){
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,canvas.width,canvas.height);
}
function clearRT(rt, r,g,b,a){
  bindRT(rt); gl.clearColor(r||0,g||0,b||0,a||0); gl.clear(gl.COLOR_BUFFER_BIT);
}
let texUnit = 0;
function bindTex(p, name, tex, unit){
  gl.activeTexture(gl.TEXTURE0 + unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(p.u(name), unit);
}
const quadVAO = gl.createVertexArray();
function drawQuad(){
  gl.bindVertexArray(quadVAO);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ==========================================================================
   SOLVER SHADERS
   Fields live in a 2D atlas of Z slices (see GLSL_GRID). All passes are
   fullscreen draws over the atlas; each fragment is one voxel.
   Velocity is in voxels/second, temperature in kilokelvin, so the numbers a
   user sees in the panel are physical.
   ========================================================================== */

const GLSL_IMPULSE = `
#define MAXIMP 4
uniform vec3 uImpPos[MAXIMP];    // voxel space
uniform vec3 uImpVel[MAXIMP];
uniform vec4 uImpParam[MAXIMP];  // radius(vox), strength, spin, type
`;

/* --- 1. velocity: advect + external forces ------------------------------- */
const SH_VEL = GLSL_IMPULSE + `
uniform sampler2D uVel, uScal;
uniform float uDt, uTime, uBuoy, uWeight, uAmb, uTurb, uTurbScale, uTurbDrift;
uniform float uDamp, uGust, uVS;   // uVS converts world units/s into voxels/s
uniform vec2 uWind;
uniform vec3 uJet;        // speed, angle(rad), spread
uniform vec4 uEmit;       // x,y,z (voxel), radius(vox)
uniform float uEmitRate;
out vec4 oCol;

vec3 noiseVec(vec3 p){
  return vec3(vnoise(p), vnoise(p + vec3(37.1, 11.7, 5.3)), vnoise(p + vec3(-13.9, 23.3, 41.7))) * 2.0 - 1.0;
}

void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  vec3 p = iv + 0.5;

  if(isWall(iv)){ oCol = vec4(0.0); return; }

  // --- semi-Lagrangian advection (RK2 back-trace for less drift)
  vec3 v0 = tex3D(uVel, p).xyz;
  vec3 mid = p - v0 * uDt * 0.5;
  vec3 vm  = tex3D(uVel, mid).xyz;
  vec3 v   = tex3D(uVel, p - vm * uDt).xyz;

  vec4 s = tex3D(uScal, p);
  float dens = s.x, T = s.y;

  // --- buoyancy: hot gas rises, cold soot falls (m/s^2 per kK -> voxels/s)
  v.y += (uBuoy * (T - uAmb) - uWeight * dens) * uDt * uVS;

  // --- curl-ish noise forcing (projection removes any divergence we add)
  if(uTurb > 0.0){
    vec3 np = p / uGrid.x * uTurbScale * 6.0 + vec3(0.0, -uTime * uTurbDrift, uTime * uTurbDrift * 0.3);
    vec3 f = noiseVec(np) + 0.5 * noiseVec(np * 2.17 + 19.3);
    float w = smoothstep(0.01, 0.35, dens) + smoothstep(uAmb + 0.15, uAmb + 1.2, T);
    v += f * uTurb * w * 5.0 * uDt * uVS;
  }

  // --- wind with low frequency gusting
  float gust = 1.0 + uGust * (vnoise(vec3(uTime * 0.27, p.y * 0.02, 3.3)) * 2.0 - 1.0) * 2.0;
  // a draught is a background velocity the air relaxes toward, not an endless push
  v.xz = mix(v.xz, uWind * gust * uVS, saturate(uDt * 0.9));

  // --- emitter momentum (jet)
  if(uJet.x > 0.0){
    vec3 d = p - uEmit.xyz;
    float r = length(d) / max(uEmit.w, 1e-3);
    float g = exp(-r * r * 2.0);
    float a = uJet.y;
    vec3 dir = vec3(sin(a), cos(a), 0.0);
    vec3 rj = hash33(floor(p) + floor(uTime * 60.0)) * 2.0 - 1.0;
    dir = normalize(dir + rj * uJet.z);
    // prescribed inflow: inside the nozzle the velocity IS the jet velocity
    v = mix(v, dir * uJet.x * uVS, saturate(g * uDt * 20.0));
  }

  // --- interactive impulses
  for(int i = 0; i < MAXIMP; i++){
    vec4 pr = uImpParam[i];
    if(pr.y <= 0.0) continue;
    vec3 d = p - uImpPos[i];
    float r = length(d) / max(pr.x, 1e-3);
    float g = exp(-r * r * 2.2);
    int ty = int(pr.w + 0.5);
    float kick = min(uDt * 26.0, 1.0);              // impulse spread over its lifetime
    if(ty == 1){                      // blast: radial momentum, speed in uImpVel.x
      v += normalize(d + 1e-4) * uImpVel[i].x * uVS * g * kick;
    } else if(ty == 3){               // vortex ring around Y
      vec3 tang = cross(vec3(0.0, 1.0, 0.0), d);
      tang /= length(tang) + 1e-4;
      v += (tang * 1.35 + vec3(0.0, 0.35, 0.0)) * uImpVel[i].x * uVS * g * kick;
    } else if(ty == 4){               // quench: kill motion
      v *= mix(1.0, 0.82, g);
    } else {                          // ignite / directed gust
      v += uImpVel[i] * uVS * g * kick;
    }
  }

  v *= exp(-uDamp * uDt * 6.0);
  oCol = vec4(v, 0.0);
}`;

/* --- 2. curl of the velocity field --------------------------------------- */
const SH_CURL = `
uniform sampler2D uVel;
out vec4 oCol;
void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  vec3 L = fetch3D(uVel, iv - vec3(1.0,0.0,0.0)).xyz, R = fetch3D(uVel, iv + vec3(1.0,0.0,0.0)).xyz;
  vec3 D = fetch3D(uVel, iv - vec3(0.0,1.0,0.0)).xyz, U = fetch3D(uVel, iv + vec3(0.0,1.0,0.0)).xyz;
  vec3 B = fetch3D(uVel, iv - vec3(0.0,0.0,1.0)).xyz, F = fetch3D(uVel, iv + vec3(0.0,0.0,1.0)).xyz;
  vec3 w = 0.5 * vec3( (U.z - D.z) - (F.y - B.y),
                       (F.x - B.x) - (R.z - L.z),
                       (R.y - L.y) - (U.x - D.x) );
  oCol = vec4(w, length(w));
}`;

/* --- 3. vorticity confinement -------------------------------------------- */
const SH_VORT = `
uniform sampler2D uVel, uCurl;
uniform float uDt, uEps;
out vec4 oCol;
void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  vec3 v = fetch3D(uVel, iv).xyz;
  if(isWall(iv)){ oCol = vec4(0.0); return; }
  float l = fetch3D(uCurl, iv - vec3(1.0,0.0,0.0)).w, r = fetch3D(uCurl, iv + vec3(1.0,0.0,0.0)).w;
  float d = fetch3D(uCurl, iv - vec3(0.0,1.0,0.0)).w, u = fetch3D(uCurl, iv + vec3(0.0,1.0,0.0)).w;
  float b = fetch3D(uCurl, iv - vec3(0.0,0.0,1.0)).w, f = fetch3D(uCurl, iv + vec3(0.0,0.0,1.0)).w;
  vec3 grad = 0.5 * vec3(r - l, u - d, f - b);
  vec3 N = grad / (length(grad) + 1e-5);
  vec3 w = fetch3D(uCurl, iv).xyz;
  v += cross(N, w) * uEps * uDt * 22.0;
  oCol = vec4(v, 0.0);
}`;

/* --- 4. divergence (with thermal expansion source) ----------------------- */
const SH_DIV = `
uniform sampler2D uVel, uScal;
uniform float uExp;
out vec4 oCol;
void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  float L = fetch3D(uVel, iv - vec3(1.0,0.0,0.0)).x, R = fetch3D(uVel, iv + vec3(1.0,0.0,0.0)).x;
  float D = fetch3D(uVel, iv - vec3(0.0,1.0,0.0)).y, U = fetch3D(uVel, iv + vec3(0.0,1.0,0.0)).y;
  float B = fetch3D(uVel, iv - vec3(0.0,0.0,1.0)).z, F = fetch3D(uVel, iv + vec3(0.0,0.0,1.0)).z;
  float div = 0.5 * ((R - L) + (U - D) + (F - B));
  // burning gas expands — a positive divergence source where fuel is consumed
  float burn = fetch3D(uScal, iv).w;
  oCol = vec4(div - uExp * burn * 0.6, 0.0, 0.0, 0.0);
}`;

/* --- 5. Jacobi pressure iteration ---------------------------------------- */
const SH_JACOBI = `
uniform sampler2D uPress, uDiv;
out vec4 oCol;
float nb(vec3 iv, vec3 o, float pc){
  vec3 n = iv + o;
  if(n.y > uGrid.y - 1.0) return 0.0;              // open lid: p = 0
  if(isWall(n) || outside(n)) return pc;           // solid: Neumann
  return fetch3D(uPress, n).x;
}
void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  float pc = fetch3D(uPress, iv).x;
  float d = fetch3D(uDiv, iv).x;
  float s = nb(iv, vec3(-1,0,0), pc) + nb(iv, vec3(1,0,0), pc)
          + nb(iv, vec3(0,-1,0), pc) + nb(iv, vec3(0,1,0), pc)
          + nb(iv, vec3(0,0,-1), pc) + nb(iv, vec3(0,0,1), pc);
  oCol = vec4((s - d) / 6.0, 0.0, 0.0, 0.0);
}`;

/* --- 6. projection: make the field divergence free ----------------------- */
const SH_PROJ = `
uniform sampler2D uVel, uPress;
out vec4 oCol;
float pat(vec3 iv, float pc){
  if(iv.y > uGrid.y - 1.0) return 0.0;
  if(isWall(iv) || outside(iv)) return pc;
  return fetch3D(uPress, iv).x;
}
void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  if(isWall(iv)){ oCol = vec4(0.0); return; }
  float pc = fetch3D(uPress, iv).x;
  float l = pat(iv - vec3(1,0,0), pc), r = pat(iv + vec3(1,0,0), pc);
  float d = pat(iv - vec3(0,1,0), pc), u = pat(iv + vec3(0,1,0), pc);
  float b = pat(iv - vec3(0,0,1), pc), f = pat(iv + vec3(0,0,1), pc);
  vec3 v = fetch3D(uVel, iv).xyz - 0.5 * vec3(r - l, u - d, f - b);
  // no-slip against the solid shell
  if(iv.x < 2.0) v.x = max(v.x, 0.0);
  if(iv.x > uGrid.x - 3.0) v.x = min(v.x, 0.0);
  if(iv.z < 2.0) v.z = max(v.z, 0.0);
  if(iv.z > uGrid.z - 3.0) v.z = min(v.z, 0.0);
  if(iv.y < 2.0) v.y = max(v.y, 0.0);
  oCol = vec4(v, 0.0);
}`;

/* --- 7. scalars: advection, combustion, injection ------------------------ */
const SH_SCAL = GLSL_IMPULSE + `
uniform sampler2D uVel, uScal, uHat;
uniform float uDt, uTime;
uniform float uBurn, uIgn, uHeat, uSoot, uCool, uAmb, uDensDiss, uTempDiss;
uniform float uInjRate, uInjTemp, uTmax, uSmokeInj;
uniform vec4 uEmit;      // xyz voxel, w radius(vox)
uniform int uMode;       // 0 = back-advect only, 1 = full step
uniform int uMacCormack;
out vec4 oCol;

void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(0.0); return; }
  vec3 p = iv + 0.5;

  vec3 v0 = tex3D(uVel, p).xyz;
  vec3 back = p - v0 * uDt;

  if(uMode == 0){                    // first half of MacCormack
    oCol = tex3D(uScal, back);
    return;
  }

  vec4 s;
  if(uMacCormack == 1){
    vec4 hat = tex3D(uHat, p);                    // already back-advected
    vec4 fwd = tex3D(uHat, p + v0 * uDt);         // re-advect forward
    vec4 cur = fetch3D(uScal, iv);
    s = hat + 0.5 * (cur - fwd);
    // limiter: clamp to the range of the source cells to stay stable
    vec3 bi = floor(back - 0.5);
    vec4 mn = vec4(1e9), mx = vec4(-1e9);
    for(int i = 0; i < 8; i++){
      vec3 o = vec3(float(i & 1), float((i >> 1) & 1), float((i >> 2) & 1));
      vec4 t = fetch3D(uScal, bi + o);
      mn = min(mn, t); mx = max(mx, t);
    }
    s = clamp(s, mn, mx);
  } else {
    s = tex3D(uScal, back);
  }

  float dens = max(s.x, 0.0);
  float T    = max(s.y, 0.0);
  float fuel = max(s.z, 0.0);

  // --- injection (the emitter)
  if(uInjRate > 0.0){
    vec3 d = (p - uEmit.xyz) / max(uEmit.w, 1e-3);
    float g = exp(-dot(d, d) * 2.5);
    float flick = 0.7 + 0.6 * vnoise(vec3(p.xz * 0.14, uTime * 1.7));
    fuel += uInjRate * g * flick * uDt * 7.0;
    T = mix(T, max(T, uInjTemp), saturate(g * uDt * 14.0));
  }
  if(uSmokeInj > 0.0){
    vec3 d = (p - uEmit.xyz) / max(uEmit.w, 1e-3);
    dens += uSmokeInj * exp(-dot(d, d) * 2.5) * uDt * 3.0;
  }

  // --- interactive impulses
  for(int i = 0; i < MAXIMP; i++){
    vec4 pr = uImpParam[i];
    if(pr.y <= 0.0) continue;
    int ty = int(pr.w + 0.5);
    vec3 d = (p - uImpPos[i]) / max(pr.x, 1e-3);
    float g = exp(-dot(d, d) * 2.2);
    if(ty == 0){                                  // ignite / paint fuel
      fuel += pr.y * g * uDt * 9.0;
      T = mix(T, max(T, pr.z), saturate(g * uDt * 14.0));
    } else if(ty == 1){                           // blast: instant hot fuel-air ball
      fuel += pr.y * g * uDt * 8.0;
      dens += pr.y * g * uDt * 0.6;
      T = mix(T, max(T, pr.z), saturate(g * uDt * 26.0));
    } else if(ty == 4){                           // quench
      T = mix(T, uAmb, saturate(g * uDt * 6.0));
      dens *= mix(1.0, 0.86, g);
      fuel *= mix(1.0, 0.7, g);
    }
  }

  // --- combustion: fuel above the ignition point burns, releasing heat + soot
  float burn = 0.0;
  if(T > uIgn){
    burn = min(fuel, fuel * uBurn * uDt * (0.3 + saturate((T - uIgn) * 1.6)));
    fuel -= burn;
    // the reaction cannot push past the adiabatic flame temperature
    T    = min(T + burn * uHeat * 1.2, max(T, uTmax));
    dens += burn * uSoot * 1.4;
  }
  fuel *= exp(-0.12 * uDt);

  // --- radiative cooling: fast while incandescent, slow once dark
  float Tk = max(T - uAmb, 0.0);
  T = uAmb + Tk * exp(-uCool * uDt * (0.25 + Tk * Tk * 0.55));

  dens *= exp(-uDensDiss * uDt);
  float Tk2 = max(T - uAmb, 0.0) * exp(-uTempDiss * uDt);
  T = uAmb + Tk2;

  if(isWall(iv)) { dens *= 0.85; }
  // open lid: the plume leaves the domain instead of pooling under the ceiling
  float lid = smoothstep(uGrid.y - 1.0, uGrid.y - 7.0, iv.y);
  dens *= mix(0.80, 1.0, lid);
  fuel *= mix(0.80, 1.0, lid);

  oCol = vec4(clamp(dens, 0.0, 24.0), clamp(T, 0.0, 6.0), clamp(fuel, 0.0, 24.0), burn / max(uDt, 1e-4));
}`;

/* --- 8. light transmittance volume --------------------------------------- */
const SH_LIGHT = `
uniform sampler2D uScal;
uniform vec3 uSunDir;     // voxel-space direction toward the sun
uniform vec3 uFirePos;    // voxel space
uniform float uSigma, uSteps, uFirePow;
out vec4 oCol;

void main(){
  vec3 iv = fragVoxel();
  if(iv.z > uGrid.z - 1.0){ oCol = vec4(1.0, 1.0, 0.0, 0.0); return; }
  vec3 p = iv + 0.5;
  float n = max(uSteps, 2.0);
  float diag = length(uGrid) * 0.55;
  float ds = diag / n;

  // sun
  float tau = 0.0;
  vec3 q = p + uSunDir * ds * 0.5;
  for(int i = 0; i < 40; i++){
    if(float(i) >= n) break;
    if(q.x < 0.0 || q.y < 0.0 || q.z < 0.0 || q.x > uGrid.x || q.y > uGrid.y || q.z > uGrid.z) break;
    tau += tex3D(uScal, q).x;
    q += uSunDir * ds;
  }
  float sunT = exp(-tau * uSigma * ds);

  // sky (straight up, cheap ambient occlusion of the medium)
  float tauU = 0.0;
  float nu = max(n * 0.5, 2.0);
  float dsu = (uGrid.y - p.y) / nu;
  q = p + vec3(0.0, dsu * 0.5, 0.0);
  for(int i = 0; i < 20; i++){
    if(float(i) >= nu) break;
    tauU += tex3D(uScal, q).x;
    q.y += dsu;
  }
  float skyT = exp(-tauU * uSigma * dsu * 0.8);

  // the fire lighting its own smoke: transmittance toward the hot core
  vec3 fd = uFirePos - p;
  float fl = length(fd) + 1e-3;
  vec3 fdir = fd / fl;
  float tauF = 0.0;
  float nf = 6.0;
  float dsf = fl / nf;
  q = p + fdir * dsf * 0.5;
  for(int i = 0; i < 6; i++){
    tauF += tex3D(uScal, q).x;
    q += fdir * dsf;
  }
  float fireT = exp(-tauF * uSigma * dsf) * uFirePow / (1.0 + fl * fl * 0.02);

  oCol = vec4(sunT, skyT, fireT, 0.0);
}`;

/* --- 9. metric reduction (per channel op) -------------------------------- */
const SH_REDUCE = `
uniform sampler2D uSrc;
uniform vec2 uSrcSize;
uniform vec2 uDstSize;
uniform int uFirst;
uniform vec3 uGridR;
uniform vec2 uTilesR;
out vec4 oCol;
void main(){
  ivec2 d = ivec2(gl_FragCoord.xy);
  vec4 acc = vec4(0.0, 0.0, 0.0, 0.0);
  for(int y = 0; y < 8; y++){
    for(int x = 0; x < 8; x++){
      ivec2 sc = d * 8 + ivec2(x, y);
      if(float(sc.x) >= uSrcSize.x || float(sc.y) >= uSrcSize.y) continue;
      vec4 t = texelFetch(uSrc, sc, 0);
      if(uFirst == 1){
        // t = (density, temperature, fuel, burn) — build the statistics we score on
        vec2 tile = floor(vec2(sc) / uGridR.xy);
        float sl = tile.y * uTilesR.x + tile.x;
        if(sl > uGridR.z - 1.0) continue;
        float yN = (float(sc.y) - tile.y * uGridR.y) / uGridR.y;
        float dn = t.x;
        acc.x += dn;                                    // smoke mass
        acc.y  = max(acc.y, t.y);                       // peak temperature
        acc.z += dn * yN;                               // mass-weighted height
        acc.w += t.w;                                   // total burn rate
      } else {
        acc.x += t.x; acc.y = max(acc.y, t.y); acc.z += t.z; acc.w += t.w;

}`;

/* --- 10. velocity magnitude reduction ------------------------------------ */
const SH_REDUCEV = `
uniform sampler2D uSrc;
uniform vec2 uSrcSize;
uniform int uFirst;
out vec4 oCol;
void main(){
  ivec2 d = ivec2(gl_FragCoord.xy);
  vec4 acc = vec4(0.0);
  for(int y = 0; y < 8; y++){
    for(int x = 0; x < 8; x++){
      ivec2 sc = d * 8 + ivec2(x, y);
      if(float(sc.x) >= uSrcSize.x || float(sc.y) >= uSrcSize.y) continue;
      vec4 t = texelFetch(uSrc, sc, 0);
      float m = (uFirst == 1) ? length(t.xyz) : t.x;
      acc.x = max(acc.x, m);
      acc.y += (uFirst == 1) ? length(t.xyz) : t.y;

  oCol = acc;
}`;

/* shared camera / sky / blackbody */

uniform vec3 uCamPos;
uniform mat3 uCamMat;       // columns: right, up, forward
uniform float uTanFov, uAspect;
uniform vec2 uRes;

`;
const GLSL_BB = `
// Planck locus approximation (Helland), returned in linear light
vec3 blackbody(float K){
  K = clamp(K, 700.0, 14000.0);
  float t = K / 100.0;
  float r, g, b;
  if(t <= 66.0) r = 255.0; else r = 329.698727446 * pow(max(t - 60.0, 1e-3), -0.1332047592);
  if(t <= 66.0) g = 99.4708025861 * log(max(t, 1.0)) - 161.1195681661;
  else          g = 288.1221695283 * pow(max(t - 60.0, 1e-3), -0.0755148492);
  if(t >= 66.0) b = 255.0;
  else if(t <= 19.0) b = 0.0;
  else b = 138.5177312231 * log(max(t - 10.0, 1e-3)) - 305.0447927307;
  vec3 c = saturate(vec3(r, g, b) / 255.0);
  return c * c;  // approx sRGB -> linear

`;
const GLSL_SKY = GLSL_BB + `
uniform vec3 uSunDirW;      // world direction toward the sun
uniform vec3 uSunCol;       // already scaled by intensity
uniform vec3 uSkyTop, uSkyHor, uSkyGnd;
uniform float uSkyInt, uFogDens;
uniform vec3 uFogCol;

vec3 skyRadiance(vec3 d){
  float up = d.y;
  vec3 c = mix(uSkyHor, uSkyTop, pow(saturate(up), 0.42));
  c = mix(c, uSkyGnd, saturate(-up * 3.0));
  float mu = saturate(dot(d, uSunDirW));
  c += uSunCol * (pow(mu, 1400.0) * 55.0 + pow(mu, 12.0) * 0.16 + pow(mu, 3.0) * 0.045);
  return c * uSkyInt;
}
// height-falloff aerial perspective with forward in-scatter
vec3 applyFog(vec3 col, vec3 ro, vec3 rd, float dist){
  float H = 7.0;
  float y0 = max(ro.y, 0.0);
  float f = uFogDens * exp(-y0 / H) * (1.0 - exp(-dist * max(rd.y, 0.0001) / H)) / max(rd.y, 0.0001);
  f = 1.0 - exp(-max(f, 0.0));
  float mu = saturate(dot(rd, uSunDirW));
  vec3 fc = uFogCol * uSkyInt + uSunCol * pow(mu, 7.0) * 0.45;
  return mix(col, fc, saturate(f));

`;

/* --- the set: signed distance field, GGX, smoke-shadowed sun ------------- */
const SH_SCENE = GLSL_CAM + GLSL_SKY + `
uniform sampler2D uLight;
uniform vec3 uBoxMin, uBoxMax, uGridF;
uniform vec3 uFirePosW, uFireCol;
uniform float uFireGain, uTime, uSetOn;
layout(location = 0) out vec4 oCol;
layout(location = 1) out vec4 oDepth;

float sdBox(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float sdCyl(vec3 p, float h, float r){
  vec2 d = abs(vec2(length(p.xz), p.y)) - vec2(r, h);
  return min(max(d.x, d.y), 0.0) + length(max(d, 0.0));
}
float sdTorus(vec3 p, vec2 t){ vec2 q = vec2(length(p.xz) - t.x, p.y); return length(q) - t.y; }

float mapScene(vec3 p, out float mid){
  mid = 1.0;
  // --- ground: compacted dirt with gravel
  float h = 0.06 * fbm2(p.xz * 0.55, 3) + 0.018 * fbm2(p.xz * 3.1, 2);
  float d = p.y - h * 0.8 + 0.02;

  if(uSetOn > 0.5){
    // --- fire ring: nine stones in polar repetition
    float rad = length(p.xz);
    float ang = atan(p.z, p.x);

    float a2 = mod(ang + k * 0.5, k) - k * 0.5;
    vec3 rp = vec3(cos(a2) * rad, p.y, sin(a2) * rad);
    float dr = length((rp - vec3(1.12, 0.05, 0.0)) * vec3(1.0, 1.25, 1.0)) - 0.23;
    dr -= 0.045 * fbm3(rp * 9.0, 2);
    if(dr < d){ d = dr; mid = 2.0; }

    // --- two stacked crates
    vec3 cp = p - vec3(-1.95, 0.28, 1.25);
    cp.xz = rot2(0.42) * cp.xz;
    float c1 = sdBox(cp, vec3(0.3, 0.3, 0.3)) - 0.02;
    vec3 cp2 = p - vec3(-1.72, 0.82, 1.42);
    cp2.xz = rot2(-0.2) * cp2.xz;
    float c2 = sdBox(cp2, vec3(0.26, 0.26, 0.26)) - 0.02;
    float cr = min(c1, c2);
    if(cr < d){ d = cr; mid = 3.0; }

    // --- oil drum
    vec3 dp = p - vec3(2.1, 0.44, -1.5);
    float dm = sdCyl(dp, 0.44, 0.3);
    dm = max(dm, -sdCyl(dp - vec3(0.0, 0.44, 0.0), 0.06, 0.24));   // open top
    dm = min(dm, sdTorus(dp - vec3(0.0, 0.12, 0.0), vec2(0.3, 0.025)));
    dm = min(dm, sdTorus(dp + vec3(0.0, 0.12, 0.0), vec2(0.3, 0.025)));
    if(dm < d){ d = dm; mid = 4.0; }

    // --- a few scattered rocks
    vec3 sp = p - vec3(1.1, 0.05, 2.1);
    float s1 = length(sp * vec3(1.0, 1.5, 1.1)) - 0.17 - 0.03 * fbm3(sp * 11.0, 2);
    vec3 sp2 = p - vec3(-2.6, 0.03, -0.8);
    float s2 = length(sp2 * vec3(1.0, 1.7, 1.0)) - 0.13 - 0.03 * fbm3(sp2 * 13.0, 2);

float mapD(vec3 p){ float m; return mapScene(p, m); }

vec3 calcNormal(vec3 p, float e){
  vec2 k = vec2(1.0, -1.0) * e;
  return normalize(vec3(
    mapD(p + k.xyy) - mapD(p - k.xyy),
    mapD(p + k.yxy) - mapD(p - k.yxy),
    mapD(p + k.yyx) - mapD(p - k.yyx)));
}
float softShadow(vec3 ro, vec3 rd, float mint, float maxt, float k){
  float res = 1.0, t = mint;
  for(int i = 0; i < 40; i++){
    if(t > maxt) break;
    float h = mapD(ro + rd * t);
    res = min(res, k * h / t);
    if(res < 0.004) return 0.0;
    t += clamp(h, 0.02, 0.35);

  return saturate(res);
}
float calcAO(vec3 p, vec3 n){
  float occ = 0.0, sca = 1.0;

    float hh = 0.015 + 0.14 * float(i) / 4.0;
    float d = mapD(p + n * hh);
    occ += (hh - d) * sca;
    sca *= 0.82;

  return saturate(1.0 - 2.2 * occ);
}
float ggx(vec3 n, vec3 v, vec3 l, float rough){
  float a = max(rough * rough, 1e-3);
  vec3 h = normalize(v + l);
  float nh = saturate(dot(n, h)), nv = saturate(dot(n, v)), nl = saturate(dot(n, l));
  float d = (nh * nh * (a * a - 1.0) + 1.0);
  d = a * a / max(PI * d * d, 1e-6);
  float k = a * 0.5;
  float gv = nv / (nv * (1.0 - k) + k), gll = nl / (nl * (1.0 - k) + k);
  float f = 0.04 + 0.96 * pow(1.0 - saturate(dot(h, v)), 5.0);
  return d * gv * gll * f / max(4.0 * nv * nl + 1e-4, 1e-4);
}
// smoke shadow: sun transmittance stored in the light volume
float smokeShadow(vec3 p){
  vec3 t = (p - uBoxMin) / (uBoxMax - uBoxMin);
  if(any(lessThan(t, vec3(0.0))) || any(greaterThan(t, vec3(1.0)))) return 1.0;
  return tex3Dn(uLight, t).r;
}
void surfaceProps(float mid, vec3 p, out vec3 alb, out float rough, out float metal){
  if(mid < 1.5){                                 // dirt / gravel
    float g = fbm3(p * 5.5, 3);
    alb = mix(vec3(0.085, 0.068, 0.055), vec3(0.16, 0.13, 0.105), g);
    alb = mix(alb, vec3(0.04, 0.036, 0.034), smoothstep(0.55, 0.9, fbm3(p * 1.3 + 4.0, 2)));  // scorch
    rough = 0.92; metal = 0.0;
  } else if(mid < 2.5){                          // stone
    float g = fbm3(p * 8.0, 3);
    alb = mix(vec3(0.10, 0.10, 0.105), vec3(0.21, 0.20, 0.19), g);
    rough = 0.72 - 0.12 * g; metal = 0.0;
  } else if(mid < 3.5){                          // wood crate
    float grain = fbm3(vec3(p.x * 30.0, p.y * 3.0, p.z * 30.0), 2);
    alb = mix(vec3(0.13, 0.082, 0.045), vec3(0.22, 0.14, 0.075), grain);
    rough = 0.78; metal = 0.0;
  } else {                                       // rusted steel
    float r = fbm3(p * 6.0, 3);
    alb = mix(vec3(0.055, 0.058, 0.062), vec3(0.20, 0.085, 0.035), smoothstep(0.42, 0.75, r));
    rough = mix(0.34, 0.85, smoothstep(0.42, 0.8, r)); metal = mix(1.0, 0.15, smoothstep(0.42, 0.8, r));

void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 ro = uCamPos, rd = rayDir(uv);

  float t = 0.0, mid = 1.0;
  bool hit = false;
  for(int i = 0; i < 150; i++){
    vec3 p = ro + rd * t;
    float d = mapScene(p, mid);
    if(d < 0.0015 * t + 0.0008){ hit = true; break; }
    t += d * 0.85;
    if(t > 60.0) break;
  }

  vec3 col;
  if(!hit){
    col = skyRadiance(rd);
    t = 1e5;
  } else {
    vec3 p = ro + rd * t;
    vec3 n = calcNormal(p, max(0.0015 * t, 0.0012));
    float m; mapScene(p, m);
    vec3 alb; float rough, metal;
    surfaceProps(m, p, alb, rough, metal);
    vec3 V = -rd;

    float ao = calcAO(p, n);
    float ndl = saturate(dot(n, uSunDirW));
    float sh = ndl > 0.0 ? softShadow(p + n * 0.01, uSunDirW, 0.02, 14.0, 12.0) : 0.0;
    sh *= smokeShadow(p + n * 0.02);
    vec3 diff = alb * (1.0 - metal) / PI;
    col = uSunCol * ndl * sh * (diff + vec3(ggx(n, V, uSunDirW, rough)) * mix(vec3(1.0), alb, metal));

    vec3 amb = mix(uSkyGnd, uSkyTop, saturate(0.5 + 0.5 * n.y)) * uSkyInt;
    col += amb * alb * ao * (1.0 - metal * 0.7);

    vec3 fd = uFirePosW - p;
    float fl = length(fd) + 1e-3;
    vec3 fdir = fd / fl;
    float fndl = saturate(dot(n, fdir));
    float fsh = fndl > 0.0 ? softShadow(p + n * 0.02, fdir, 0.03, min(fl, 6.0), 9.0) : 0.0;
    float atten = uFireGain / (1.0 + fl * fl * 0.55);
    col += uFireCol * fndl * fsh * atten * (diff * PI + vec3(ggx(n, V, fdir, rough)) * mix(vec3(1.0), alb, metal)) * 0.7;

    col = applyFog(col, ro, rd, t);
  }
  oCol = vec4(col, 1.0);
  oDepth = vec4(t, 0.0, 0.0, 0.0);
}`;

/* --- the medium: single-scattering raymarch with blackbody emission ------ */
const SH_VOLUME = GLSL_CAM + GLSL_SKY + `
uniform sampler2D uScal, uLight, uDepth;
uniform vec3 uBoxMin, uBoxMax;
uniform float uExt, uAlbedo, uPhaseG, uEmisGain, uEmisT, uSootEmis, uBBShift;
uniform float uSteps, uJitter, uShadowStr, uSkyLight, uFireGain, uTime, uFrame;
uniform float uDetail, uDetailScale;
uniform vec3 uFireCol;
layout(location = 0) out vec4 oVol;    // premultiplied radiance + transmittance
layout(location = 1) out vec4 oHeat;   // refraction potential

vec2 boxHit(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax){
  vec3 inv = 1.0 / rd;
  vec3 t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 a = min(t0, t1), b = max(t0, t1);
  return vec2(max(max(a.x, a.y), a.z), min(min(b.x, b.y), b.z));
}
float phaseHG(float c, float g){
  float d = 1.0 + g * g - 2.0 * g * c;
  return (1.0 - g * g) / (4.0 * PI * max(d * sqrt(max(d, 1e-4)), 1e-4));
}
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  vec3 ro = uCamPos, rd = rayDir(uv);
  oVol = vec4(0.0, 0.0, 0.0, 1.0);
  oHeat = vec4(0.0);

  vec2 h = boxHit(ro, rd, uBoxMin, uBoxMax);
  float sceneT = texture(uDepth, uv).r;
  float t0 = max(h.x, 0.0), t1 = min(h.y, sceneT);
  if(h.y <= h.x || t1 <= t0) return;

  float n = uSteps;
  float ds = (t1 - t0) / n;
  float jit = (ign(gl_FragCoord.xy + vec2(uFrame * 7.13, uFrame * 3.71)) - 0.5) * uJitter;
  float t = t0 + ds * (0.5 + jit);

  vec3 boxSize = uBoxMax - uBoxMin;
  float cosVL = dot(rd, uSunDirW);
  float ph = phaseHG(cosVL, uPhaseG);
  float phBack = phaseHG(cosVL, -uPhaseG * 0.35);
  vec3 acc = vec3(0.0);
  float tr = 1.0;
  float heat = 0.0;

  for(int i = 0; i < 240; i++){
    if(float(i) >= n || tr < 0.004) break;
    vec3 p = ro + rd * t;
    vec3 g01 = (p - uBoxMin) / boxSize;
    vec4 s = tex3Dn(uScal, g01);
    float dens = s.x, T = s.y;
    heat += max(T - 0.29, 0.0) * ds * tr;
    if(dens > 0.0015){
      if(uDetail > 0.001){
        // the octave the grid could not resolve, scrolling with the plume
        float nz = vnoise(p * uDetailScale + vec3(0.0, -uTime * 1.1, 0.0));
        float k = uDetail * smoothstep(1.6, 0.08, dens);
        dens *= mix(1.0, 0.25 + 1.75 * nz, k);

      float sigT = dens * uExt;
      vec4 L = tex3Dn(uLight, g01);
      float sunT = pow(saturate(L.r), max(uShadowStr, 0.001));
      vec3 inscat = uSunCol * sunT * mix(ph, phBack, 0.35)
                  + mix(uSkyHor, uSkyTop, 0.65) * uSkyInt * uSkyLight * L.g * 0.16
                  + uFireCol * L.b * uFireGain * 0.12;
      vec3 src = inscat * (sigT * uAlbedo);

      // incandescent soot: Planck radiance gated by temperature and soot load
      float ge = smoothstep(uEmisT, uEmisT + 0.32, T) * (1.0 - exp(-dens * uSootEmis * 2.5));
      float reac = s.w * 0.045;                     // the reaction zone itself glows
      if(ge > 0.0 || reac > 0.0){
        vec3 bb = blackbody(T * 1000.0 + uBBShift * 900.0);
        src += bb * (pow(T, 3.4) * ge * 0.3 + reac) * uEmisGain;
      }
      float a = 1.0 - exp(-sigT * ds);
      acc += tr * src * (a / max(sigT, 1e-4));
      tr *= 1.0 - a;

  oHeat = vec4(heat, 0.0, 0.0, 0.0);
}`;

/* --- field inspector ------------------------------------------------------ */
const SH_FIELD = GLSL_CAM + `
uniform sampler2D uScal, uVel, uDiv, uLight;
uniform vec3 uBoxMin, uBoxMax;
uniform int uMode;       // 1 dens 2 temp 3 vel 4 div 5 light 6 slice
uniform float uSliceZ, uGain;
out vec4 oCol;
vec2 boxHit(vec3 ro, vec3 rd, vec3 bmin, vec3 bmax){
  vec3 inv = 1.0 / rd;
  vec3 t0 = (bmin - ro) * inv, t1 = (bmax - ro) * inv;
  vec3 a = min(t0, t1), b = max(t0, t1);
  return vec2(max(max(a.x, a.y), a.z), min(min(b.x, b.y), b.z));

    if(q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0){ oCol = vec4(0.02, 0.025, 0.03, 1.0); return; }

    float dv = tex3Dn(uDiv, g).x;
    vec3 c = turbo(s.y * 0.45) * saturate(s.y * 1.2);
    c += vec3(0.7, 0.75, 0.85) * s.x * 0.28;
    c += turbo(saturate(0.5 + dv * 4.0)) * 0.12;

  }

  vec3 ro = uCamPos, rd = rayDir(uv);
  vec2 h = boxHit(ro, rd, uBoxMin, uBoxMax);

  if(h.y > h.x){
    float t0 = max(h.x, 0.0);

      else if(uMode == 2){ mx = max(mx, tex3Dn(uScal, g).y); }

      else if(uMode == 4){ float d = tex3Dn(uDiv, g).x; acc += d * ds; }
      else if(uMode == 5){ vec4 l = tex3Dn(uLight, g); float d = tex3Dn(uScal, g).x; cacc += vec3(l.r, l.g, l.b * 0.5) * d * ds * 2.0; }

    else if(uMode == 2) col += turbo(saturate(mx * 0.4 * uGain)) * saturate(mx * 1.5);
    else if(uMode == 3) col += turbo(saturate(mx * 0.02 * uGain)) * 0.9 + cacc * 0.3;

    else if(uMode == 5) col += cacc * uGain;
