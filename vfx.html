    col += vec3(0.1, 0.35, 0.5) * saturate(edge) * 0.8;
  }
  oCol = vec4(col, 1.0);
}`;

/* ==========================================================================
   PARTICLES — state in float textures, drawn as instanced oriented quads
   ========================================================================== */
const SH_PART_UPDATE = `
uniform sampler2D uPos, uVelT, uFluid, uScal;
uniform vec3 uBoxMin, uBoxMax, uEmitW, uBlastPos;
uniform float uDt, uTime, uFrame, uCell, uPNf;
uniform float uSparkAmt, uDustAmt, uDebrisAmt, uSparkLife, uEmitR, uJetSpeed, uJetAngle;
uniform float uCoupling, uGravity, uBuoyP, uDragP, uBounce, uAmb, uInjTemp, uBlastPow;
layout(location = 0) out vec4 oPos;
layout(location = 1) out vec4 oVel;

vec3 fluidAt(vec3 p, out float T, out float dens){
  vec3 g = (p - uBoxMin) / (uBoxMax - uBoxMin);
  T = uAmb; dens = 0.0;
  if(any(lessThan(g, vec3(0.0))) || any(greaterThan(g, vec3(1.0)))) return vec3(0.0);
  vec4 s = tex3Dn(uScal, g);
  T = s.y; dens = s.x;
  return tex3Dn(uFluid, g).xyz * uCell;   // voxels/s -> world units/s
}
void main(){
  ivec2 pc = ivec2(gl_FragCoord.xy);
  int pn = int(uPNf);
  int id = pc.y * pn + pc.x;
  float fid = float(id);
  int bucket = id - (id / 8) * 8;
  int ty = bucket < 5 ? 0 : (bucket < 7 ? 1 : 2);
  float amt = ty == 0 ? uSparkAmt : (ty == 1 ? uDustAmt : uDebrisAmt);
  bool alive = hash11(fid * 0.37 + 1.3) < amt;

  vec4 P = texelFetch(uPos, pc, 0);
  vec4 Vl = texelFetch(uVelT, pc, 0);
  vec3 p = P.xyz, v = Vl.xyz;
  float life = P.w, temp = Vl.w;

  life -= uDt;

  if(life <= 0.0 || p.y < -50.0){
    if(!alive){ oPos = vec4(0.0, -999.0, 0.0, 0.0); oVel = vec4(0.0); return; }
    vec3 rr = hash33(vec3(fid, floor(uTime * 47.0), 7.7));
    vec3 r2 = hash33(vec3(fid * 1.7, floor(uTime * 31.0), 3.1));
    if(ty == 0){                                   // ember off the emitter
      float a = uJetAngle;
      vec3 jd = vec3(sin(a), cos(a), 0.0);
      vec3 dir = normalize(mix(vec3(rr.x - 0.5, 0.35 + rr.y * 0.8, rr.z - 0.5), jd, 0.5));
      p = uEmitW + (rr - 0.5) * uEmitR * 2.0;
      v = dir * (1.2 + r2.x * 3.0 + uJetSpeed * 0.45);
      temp = uInjTemp * (0.75 + 0.45 * r2.y);
      life = uSparkLife * (0.45 + rr.y * 1.1);
    } else if(ty == 1){                            // airborne dust
      p = vec3((rr.x - 0.5) * 13.0, 0.05 + rr.y * rr.y * 5.0, (rr.z - 0.5) * 13.0);
      v = vec3((r2.x - 0.5) * 0.12, (r2.y - 0.5) * 0.06, (r2.z - 0.5) * 0.12);
      temp = uAmb;
      life = 8.0 + rr.x * 14.0;
    } else {                                       // blast debris
      if(uBlastPow <= 0.0){ oPos = vec4(0.0, -999.0, 0.0, 0.0); oVel = vec4(0.0); return; }
      vec3 dir = normalize(rr * 2.0 - 1.0 + vec3(0.0, 0.35, 0.0));
      p = uBlastPos + dir * 0.25;
      v = dir * uBlastPow * (2.5 + r2.x * 9.0) + vec3(0.0, 2.0 + r2.y * 4.0, 0.0);
      temp = 0.55 + r2.z * 0.8;
      life = 2.5 + r2.y * 4.0;
    }
    oPos = vec4(p, life);
    oVel = vec4(v, temp);
    return;
  }

  float T, dens;
  vec3 vf = fluidAt(p, T, dens);

  if(ty == 1){                                     // dust: gentle drift, light coupling
    v += (vf * 0.5 - v) * (1.0 - exp(-1.6 * uCoupling * uDt));
    v.y += (T - uAmb) * 0.5 * uDt;
    v += (hash33(vec3(p.xz * 3.0, uTime * 0.3)) - 0.5) * 0.25 * uDt;
    v *= exp(-0.35 * uDt);
  } else {
    float drag = uDragP * (ty == 2 ? 0.45 : 1.0);
    v += (vf - v) * (1.0 - exp(-drag * uCoupling * uDt));
    v.y -= uGravity * uDt * (ty == 2 ? 1.6 : 1.0);
    v.y += uBuoyP * max(temp - uAmb, 0.0) * uDt * (ty == 2 ? 0.2 : 1.0);
    // embers pick up heat from the flame and then cool
    if(ty == 0){
      temp = max(temp, T * 0.95);
      float cool = 0.55 + 1.1 * saturate(length(v) * 0.12);
      temp = uAmb + max(temp - uAmb, 0.0) * exp(-cool * uDt);
    }
  }

  p += v * uDt;

  // ground contact
  float gy = 0.012;
  if(p.y < gy){
    p.y = gy;
    if(abs(v.y) > 0.25){
      v.y = -v.y * uBounce;
      v.xz *= 0.72;
      if(ty == 0) temp *= 0.72;
    } else {
      v.y = 0.0; v.xz *= exp(-6.0 * uDt);
      if(ty == 0){ temp = uAmb + (temp - uAmb) * exp(-2.2 * uDt); }
    }
  }
  if(length(p.xz) > 11.0) life = min(life, 0.4);

  oPos = vec4(p, life);
  oVel = vec4(v, temp);
}`;

const VS_PART = `#version 300 es
precision highp float;
uniform sampler2D uPos, uVelT;
uniform mat4 uViewProj;
uniform vec3 uCamPos, uCamRight, uCamUp;
uniform float uPNf, uSizeSpark, uStreak, uSparkLife, uTime;
float h11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
out vec2 vUV;
out float vDist, vTemp, vLife, vSpeed;
flat out int vType;
void main(){
  int pn = int(uPNf);
  int id = gl_InstanceID;
  ivec2 pc = ivec2(id - (id / pn) * pn, id / pn);
  vec4 P = texelFetch(uPos, pc, 0);
  vec4 Vl = texelFetch(uVelT, pc, 0);
  int bucket = id - (id / 8) * 8;
  vType = bucket < 5 ? 0 : (bucket < 7 ? 1 : 2);
  if(P.w <= 0.0){ gl_Position = vec4(0.0, 0.0, 2.0, 1.0); return; }

  vec2 c = vec2(float(gl_VertexID & 1) * 2.0 - 1.0, float((gl_VertexID >> 1) & 1) * 2.0 - 1.0);
  float sz = uSizeSpark * (vType == 0 ? 0.022 : (vType == 1 ? 0.013 : 0.035));
  float speed = length(Vl.xyz);
  float stretch = 1.0;
  if(vType == 0) stretch = 1.0 + uStreak * speed * 0.22;
  if(vType == 2) sz *= 0.6 + 0.8 * h11(float(id) * 0.13);

  // orient the quad along screen-space velocity so embers smear like a real shutter
  vec2 sv = vec2(dot(Vl.xyz, uCamRight), dot(Vl.xyz, uCamUp));
  vec2 e1 = (length(sv) > 1e-3 && vType == 0) ? normalize(sv) : vec2(1.0, 0.0);
  vec2 e2 = vec2(-e1.y, e1.x);
  vec2 off = e1 * (c.y * sz * stretch) + e2 * (c.x * sz);
  vec3 wp = P.xyz + uCamRight * off.x + uCamUp * off.y;

  vUV = c;
  vDist = length(wp - uCamPos);
  vTemp = Vl.w;
  vLife = P.w;
  vSpeed = speed;
  gl_Position = uViewProj * vec4(wp, 1.0);
}`;

const SH_PART_DRAW = `
uniform sampler2D uDepth;
uniform vec3 uSunCol, uSkyTop, uSkyGnd, uFireCol, uFirePosW, uFogCol;
uniform float uGlow, uSparkLife, uFogDens, uSkyInt, uFireGain;
uniform vec2 uRes;
in vec2 vUV;
in float vDist, vTemp, vLife, vSpeed;
flat in int vType;
out vec4 oCol;
void main(){
  float r = length(vUV);
  if(r > 1.0) discard;
  float sd = texture(uDepth, gl_FragCoord.xy / uRes).r;
  if(vDist > sd) discard;
  float soft = saturate((sd - vDist) * 14.0);

  vec3 col; float a;
  if(vType == 0){                                  // ember: blackbody core, additive
    float core = exp(-r * r * 3.2);
    vec3 bb = blackbody(vTemp * 1000.0);
    float fade = saturate(vLife * 2.2) * saturate(vTemp - 0.42);
    col = bb * core * uGlow * fade * (0.6 + pow(saturate(vTemp * 0.45), 3.0) * 2.0);
    col *= exp(-vDist * uFogDens * 0.5);
    a = 0.0;
  } else if(vType == 1){                           // dust mote: scattered light
    float core = exp(-r * r * 2.2);
    vec3 fd = uFirePosW - vec3(0.0);
    vec3 amb = mix(uSkyGnd, uSkyTop, 0.6) * uSkyInt;
    col = (amb * 0.55 + uSunCol * 0.35 + uFireCol * uFireGain * 0.1) * 0.5;
    a = core * 0.16 * saturate(vLife * 0.5);
    col *= a;
  } else {                                         // debris fragment
    float core = smoothstep(1.0, 0.55, r);
    vec3 amb = mix(uSkyGnd, uSkyTop, 0.6) * uSkyInt;
    vec3 base = vec3(0.06, 0.05, 0.045);
    col = base * (amb + uSunCol * 0.6) + uFireCol * uFireGain * 0.25 * base * 6.0;
    col += blackbody(vTemp * 1000.0) * max(vTemp - 0.7, 0.0) * 0.8;
    a = core * saturate(vLife * 1.5);
    col *= a;
  }
  col = mix(col, uFogCol * uSkyInt * a, 1.0 - exp(-vDist * uFogDens * 0.35));
  oCol = vec4(col * soft, a * soft);
}`;

/* ==========================================================================
   COMPOSITE + POST
   ========================================================================== */
const SH_COMPOSITE = `
uniform sampler2D uScene, uVol, uHeat, uDepth;
uniform vec2 uRes, uVolRes;
uniform float uHaze, uTime;
in vec2 vUV;
out vec4 oCol;
void main(){
  vec2 px = 1.0 / uVolRes;
  // refraction from the heat gradient: the optical path gradient bends the background
  float hC = texture(uHeat, vUV).r;
  float hX = texture(uHeat, vUV + vec2(px.x, 0.0)).r - texture(uHeat, vUV - vec2(px.x, 0.0)).r;
  float hY = texture(uHeat, vUV + vec2(0.0, px.y)).r - texture(uHeat, vUV - vec2(0.0, px.y)).r;
  float shim = vnoise(vec3(vUV * 42.0, uTime * 2.6)) - 0.5;
  vec2 warp = vec2(hX, hY) * 0.055 * uHaze + vec2(shim, shim * 0.7) * hC * 0.0022 * uHaze;
  vec3 scene = texture(uScene, clamp(vUV + warp, vec2(0.0), vec2(1.0))).rgb;
  vec4 vol = texture(uVol, vUV);
  oCol = vec4(scene * vol.a + vol.rgb, 1.0);
}`;

const SH_BLOOM_PRE = `
uniform sampler2D uSrc;
uniform float uThresh, uExposure;
in vec2 vUV;
out vec4 oCol;
void main(){
  vec3 c = texture(uSrc, vUV).rgb * uExposure;
  float l = max(c.r, max(c.g, c.b));
  float knee = uThresh * 0.6 + 1e-4;
  float soft = clamp(l - uThresh + knee, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee);
  float w = max(soft, l - uThresh) / max(l, 1e-4);
  oCol = vec4(c * w, 1.0);
}`;
const SH_BLOOM_DOWN = `
uniform sampler2D uSrc;
uniform vec2 uTexel;
in vec2 vUV;
out vec4 oCol;
void main(){
  vec2 t = uTexel;
  vec3 a = texture(uSrc, vUV + t * vec2(-1.0, -1.0)).rgb;
  vec3 b = texture(uSrc, vUV + t * vec2( 1.0, -1.0)).rgb;
  vec3 c = texture(uSrc, vUV + t * vec2(-1.0,  1.0)).rgb;
  vec3 d = texture(uSrc, vUV + t * vec2( 1.0,  1.0)).rgb;
  vec3 e = texture(uSrc, vUV).rgb;
  vec3 f = texture(uSrc, vUV + t * vec2(-2.0, 0.0)).rgb;
  vec3 g = texture(uSrc, vUV + t * vec2( 2.0, 0.0)).rgb;
  vec3 h = texture(uSrc, vUV + t * vec2(0.0, -2.0)).rgb;
  vec3 i = texture(uSrc, vUV + t * vec2(0.0,  2.0)).rgb;
  oCol = vec4((a + b + c + d) * 0.125 + e * 0.25 + (f + g + h + i) * 0.0625 + e * 0.0, 1.0);
}`;
const SH_BLOOM_UP = `
uniform sampler2D uSrc;
uniform vec2 uTexel;
uniform float uRadius;
in vec2 vUV;
out vec4 oCol;
void main(){
  vec2 t = uTexel * uRadius;
  vec3 s = texture(uSrc, vUV + vec2(-t.x, -t.y)).rgb * 1.0;
  s += texture(uSrc, vUV + vec2(0.0, -t.y)).rgb * 2.0;
  s += texture(uSrc, vUV + vec2(t.x, -t.y)).rgb * 1.0;
  s += texture(uSrc, vUV + vec2(-t.x, 0.0)).rgb * 2.0;
  s += texture(uSrc, vUV).rgb * 4.0;
  s += texture(uSrc, vUV + vec2(t.x, 0.0)).rgb * 2.0;
  s += texture(uSrc, vUV + vec2(-t.x, t.y)).rgb * 1.0;
  s += texture(uSrc, vUV + vec2(0.0, t.y)).rgb * 2.0;
  s += texture(uSrc, vUV + vec2(t.x, t.y)).rgb * 1.0;
  oCol = vec4(s / 16.0, 1.0);
}`;

const SH_POST = `
uniform sampler2D uSrc, uBloom;
uniform float uExposure, uBloomAmt, uChroma, uGrain, uVign, uSat, uCon, uTime;
uniform int uTonemap;
uniform vec2 uRes;
in vec2 vUV;
out vec4 oCol;

vec3 acesFitted(vec3 x){
  // Narkowicz ACES approximation
  return saturate((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14));
}
vec3 agx(vec3 v){
  const mat3 M = mat3(0.842479, 0.0784336, 0.0792237,
                      0.0423282, 0.878468, 0.0791661,
                      0.0423756, 0.0784336, 0.879142);
  v = M * v;
  v = clamp((log2(max(v, 1e-5)) + 12.47393) / 16.29142, 0.0, 1.0);
  vec3 v2 = v * v, v4 = v2 * v2;
  v = 15.5 * v4 * v2 - 40.14 * v4 * v + 31.96 * v4 - 6.868 * v2 * v + 0.4298 * v2 + 0.1191 * v - 0.00232;
  const mat3 Mi = mat3( 1.19688, -0.0980209, -0.0990297,
                       -0.0528969, 1.15190, -0.0989614,
                       -0.0529716, -0.0980435, 1.15107);
  return saturate(Mi * v);
}
vec3 filmic(vec3 x){
  vec3 X = max(vec3(0.0), x - 0.004);
  return (X * (6.2 * X + 0.5)) / (X * (6.2 * X + 1.7) + 0.06);
}
vec3 tonemap(vec3 c){
  if(uTonemap == 0) return acesFitted(c);
  if(uTonemap == 1) return agx(c);
  if(uTonemap == 2) return filmic(c);
  return c / (1.0 + c);
}
void main(){
  vec2 uv = vUV;
  vec2 d = uv - 0.5;
  float r2 = dot(d, d);

  // lateral chromatic aberration, strongest at the edges
  float ca = uChroma * 0.0022 * r2;
  vec3 hdr;
  hdr.r = texture(uSrc, uv + d * ca).r;
  hdr.g = texture(uSrc, uv).g;
  hdr.b = texture(uSrc, uv - d * ca).b;
  vec3 bl;
  bl.r = texture(uBloom, uv + d * ca * 2.0).r;
  bl.g = texture(uBloom, uv).g;
  bl.b = texture(uBloom, uv - d * ca * 2.0).b;

  vec3 c = hdr * uExposure + bl * uBloomAmt;
  c = tonemap(c);
  // grade
  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
  c = mix(vec3(l), c, uSat);
  c = saturate((c - 0.5) * uCon + 0.5);
  // vignette + grain
  c *= mix(1.0, saturate(1.0 - r2 * 1.45), uVign);
  float g = ign(gl_FragCoord.xy + vec2(fract(uTime * 37.0) * 512.0, fract(uTime * 17.0) * 512.0)) - 0.5;
  c += g * uGrain * 0.045 * (1.2 - l);
  // 8-bit dither
  c += (ign(gl_FragCoord.xy + 0.5) - 0.5) / 255.0;
  oCol = vec4(saturate(c), 1.0);
}`;

const SH_FXAA = `
uniform sampler2D uSrc;
uniform vec2 uRes;
in vec2 vUV;
out vec4 oCol;
float lum(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
void main(){
  vec2 px = 1.0 / uRes;
  vec3 mC = texture(uSrc, vUV).rgb;
  float lM = lum(mC);
  float lNW = lum(texture(uSrc, vUV + px * vec2(-1.0, -1.0)).rgb);
  float lNE = lum(texture(uSrc, vUV + px * vec2( 1.0, -1.0)).rgb);
  float lSW = lum(texture(uSrc, vUV + px * vec2(-1.0,  1.0)).rgb);
  float lSE = lum(texture(uSrc, vUV + px * vec2( 1.0,  1.0)).rgb);
  float lMin = min(lM, min(min(lNW, lNE), min(lSW, lSE)));
  float lMax = max(lM, max(max(lNW, lNE), max(lSW, lSE)));
  if(lMax - lMin < max(0.05, lMax * 0.14)){ oCol = vec4(mC, 1.0); return; }
  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));
  float rd = 1.0 / (min(abs(dir.x), abs(dir.y)) + 1e-4);
  dir = clamp(dir * rd, vec2(-8.0), vec2(8.0)) * px;
  vec3 a = 0.5 * (texture(uSrc, vUV + dir * (1.0 / 3.0 - 0.5)).rgb +
                  texture(uSrc, vUV + dir * (2.0 / 3.0 - 0.5)).rgb);
  vec3 b = a * 0.5 + 0.25 * (texture(uSrc, vUV - dir * 0.5).rgb + texture(uSrc, vUV + dir * 0.5).rgb);
  float lB = lum(b);
  oCol = vec4((lB < lMin || lB > lMax) ? a : b, 1.0);
}`;

const VS_LINES = `#version 300 es
in vec3 aPos;
uniform mat4 uViewProj;
void main(){ gl_Position = uViewProj * vec4(aPos, 1.0); }`;
const SH_LINES = `
uniform vec3 uColor;
out vec4 oCol;
void main(){ oCol = vec4(uColor, 1.0); }`;

/* ==========================================================================
   ENGINE
   ========================================================================== */
const GRIDS   = { LOW:[40,60,40], MED:[56,84,56], HIGH:[76,112,76], ULTRA:[100,148,100] };
const PN_OPT  = { '4K':64, '16K':128, '64K':256, '256K':512 };
const DOMAIN_W = 5.2;                    // world units across the sim box

let SIM = null, PROG = {}, RT = {}, PARTS = null;
let frameNo = 0, simTime = 0, paused = false, stepOnce = false;
let dtSmooth = 1/60, msSim = 0, msRender = 0;

/* ---- matrices ---------------------------------------------------------- */
function mat4Perspective(out, fovy, aspect, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  out.fill(0);
  out[0]=f/aspect; out[5]=f; out[10]=(far+near)*nf; out[11]=-1; out[14]=2*far*near*nf;
  return out;
}
function mat4LookAt(out, eye, center, up){
  const z = v3norm(v3(), v3sub(v3(), eye, center));
  const x = v3norm(v3(), v3cross(v3(), up, z));
  const y = v3cross(v3(), z, x);
  out[0]=x[0]; out[1]=y[0]; out[2]=z[0]; out[3]=0;
  out[4]=x[1]; out[5]=y[1]; out[6]=z[1]; out[7]=0;
  out[8]=x[2]; out[9]=y[2]; out[10]=z[2]; out[11]=0;
  out[12]=-v3dot(x,eye); out[13]=-v3dot(y,eye); out[14]=-v3dot(z,eye); out[15]=1;
  return out;
}
function mat4Mul(out, a, b){
  for(let i=0;i<4;i++) for(let j=0;j<4;j++){
    let s=0; for(let k=0;k<4;k++) s += a[k*4+j]*b[i*4+k];
    out[i*4+j]=s;
  }
  return out;
}

/* ---- programs ---------------------------------------------------------- */
function setupPrograms(){
  PROG.vel     = buildProgram('vel',     SH_VEL,     {grid:true});
  PROG.curl    = buildProgram('curl',    SH_CURL,    {grid:true});
  PROG.vort    = buildProgram('vort',    SH_VORT,    {grid:true});
  PROG.div     = buildProgram('div',     SH_DIV,     {grid:true});
  PROG.jacobi  = buildProgram('jacobi',  SH_JACOBI,  {grid:true});
  PROG.proj    = buildProgram('proj',    SH_PROJ,    {grid:true});
  PROG.scal    = buildProgram('scal',    SH_SCAL,    {grid:true});
  PROG.light   = buildProgram('light',   SH_LIGHT,   {grid:true});
  PROG.reduce  = buildProgram('reduce',  SH_REDUCE,  {});
  PROG.reducev = buildProgram('reducev', SH_REDUCEV, {});
  PROG.scene   = buildProgram('scene',   SH_SCENE,   {grid:true});
  PROG.volume  = buildProgram('volume',  SH_VOLUME,  {grid:true});
  PROG.field   = buildProgram('field',   SH_FIELD,   {grid:true});
  PROG.pUpd    = buildProgram('partUpd', SH_PART_UPDATE, {grid:true});
  PROG.pDraw   = buildProgram('partDraw', GLSL_BB + SH_PART_DRAW, {vs:VS_PART, noise:false});
  PROG.comp    = buildProgram('composite', SH_COMPOSITE, {});
  PROG.bPre    = buildProgram('bloomPre', SH_BLOOM_PRE, {noise:false});
  PROG.bDown   = buildProgram('bloomDown', SH_BLOOM_DOWN, {noise:false});
  PROG.bUp     = buildProgram('bloomUp', SH_BLOOM_UP, {noise:false});
  PROG.post    = buildProgram('post',    SH_POST,    {});
  PROG.fxaa    = buildProgram('fxaa',    SH_FXAA,    {noise:false});
  PROG.lines   = buildProgram('lines',   SH_LINES,   {vs:VS_LINES, noise:false});
}
function setGrid(p){
  gl.uniform3f(p.u('uGrid'), SIM.gx, SIM.gy, SIM.gz);
  gl.uniform2f(p.u('uTiles'), SIM.tx, SIM.ty);
  gl.uniform2f(p.u('uAtlas'), SIM.aw, SIM.ah);
}

/* ---- simulation resources ---------------------------------------------- */
function disposeRT(rt){
  if(!rt) return;
  if(rt.fbo){ gl.deleteFramebuffer(rt.fbo); rt.texs.forEach(t=>gl.deleteTexture(t)); }
  else if(rt.read){ disposeRT(rt.read); disposeRT(rt.write); }
}
function allocSim(resName){
  ['vel','scal','hat','curl','div','press','light'].forEach(k=>{ disposeRT(RT[k]); RT[k]=null; });
  (RT.red||[]).forEach(disposeRT);

  const d = GRIDS[resName] || GRIDS.MED;
  const gx=d[0], gy=d[1], gz=d[2];
  const tx = Math.ceil(Math.sqrt(gz)), ty = Math.ceil(gz/tx);
  const aw = gx*tx, ah = gy*ty;
  if(aw > MAX_TEX || ah > MAX_TEX) throw new Error('grid atlas exceeds MAX_TEXTURE_SIZE');
  const cell = DOMAIN_W/gx;
  SIM = {
    gx, gy, gz, tx, ty, aw, ah, cell, res:resName,
    w: gx*cell, h: gy*cell, d: gz*cell,
    boxMin: v3(-gx*cell/2, 0, -gz*cell/2),
    boxMax: v3( gx*cell/2, gy*cell, gz*cell/2)
  };
  const F = gl.RGBA16F, L = gl.LINEAR;
  RT.vel   = makePing(aw, ah, F, L);
  RT.scal  = makePing(aw, ah, F, L);
  RT.hat   = makeRT(aw, ah, F, L);
  RT.curl  = makeRT(aw, ah, F, L);
  RT.div   = makeRT(aw, ah, gl.R16F, L);
  RT.press = makePing(aw, ah, gl.R16F, L);
  RT.light = makeRT(aw, ah, F, L);

  // reduction pyramid (8x8 per step)
  RT.red = [];
  let w = Math.ceil(aw/8), h = Math.ceil(ah/8);
  for(;;){
    RT.red.push(makeRT(w, h, gl.RGBA32F, gl.NEAREST));
    if(w===1 && h===1) break;
    w = Math.ceil(w/8); h = Math.ceil(h/8);
    if(RT.red.length > 6) break;
  }
  resetFields();
}
function resetFields(){
  clearRT(RT.vel.read, 0,0,0,0);  clearRT(RT.vel.write, 0,0,0,0);
  clearRT(RT.press.read, 0,0,0,0); clearRT(RT.press.write, 0,0,0,0);
  clearRT(RT.div, 0,0,0,0);        clearRT(RT.curl, 0,0,0,0);
  const amb = V.ambientTemp;
  clearRT(RT.scal.read, 0,amb,0,0); clearRT(RT.scal.write, 0,amb,0,0); clearRT(RT.hat, 0,amb,0,0);
  clearRT(RT.light, 1,1,0,0);
  simTime = 0;
}
function allocParts(name){
  if(PARTS) disposeRT(PARTS.state);
  const pn = PN_OPT[name] || 256;
  const st = makePing(pn, pn, gl.RGBA32F, gl.NEAREST, 2);
  PARTS = { pn, count: pn*pn, state: st, budget:name };
  clearRT(st.read.texs ? st.read : st.read, 0,0,0,0);
  clearRT(st.write, 0,0,0,0);
}

/* ---- screen-size resources -------------------------------------------- */
let VIEW = { w:1, h:1, rw:1, rh:1, vw:1, vh:1, dpr:1 };
function allocScreen(){
  ['scene','sceneColor','vol','comp','ldr','ldr2'].forEach(k=>{ if(RT[k] && RT[k].fbo!==undefined && k!=='sceneColor') disposeRT(RT[k]); });
  if(RT.sceneColor) gl.deleteFramebuffer(RT.sceneColor.fbo);
  (RT.bloom||[]).forEach(disposeRT);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(1, Math.floor(canvas.clientWidth  * dpr));
  const ch = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  canvas.width = cw; canvas.height = ch;
  const rs = parseFloat(V.renderScale) || 1;
  const rw = Math.max(64, Math.floor(cw*rs)), rh = Math.max(64, Math.floor(ch*rs));
  const vs = parseFloat(V.volScale) || 0.7;
  const vw = Math.max(48, Math.floor(rw*vs)), vh = Math.max(48, Math.floor(rh*vs));
  VIEW = { w:cw, h:ch, rw, rh, vw, vh, dpr };

  RT.scene = makeRT(rw, rh, gl.RGBA16F, gl.LINEAR, 1);
  const depthTex = texture2D(rw, rh, gl.R32F, gl.NEAREST);
  RT.scene.texs.push(depthTex);
  gl.deleteFramebuffer(RT.scene.fbo);
  RT.scene.fbo = framebuffer(RT.scene.texs);
  RT.sceneDepth = depthTex;
  RT.sceneColor = { fbo: framebuffer([RT.scene.texs[0]]), w:rw, h:rh, tex:RT.scene.texs[0], texs:[RT.scene.texs[0]] };

  RT.vol  = makeRT(vw, vh, gl.RGBA16F, gl.LINEAR, 2);
  RT.comp = makeRT(rw, rh, gl.RGBA16F, gl.LINEAR, 1);
  RT.ldr  = makeRT(rw, rh, gl.RGBA8, gl.LINEAR, 1);

  RT.bloom = [];
  let bw = Math.max(1, rw>>1), bh = Math.max(1, rh>>1);
  for(let i=0;i<6 && bw>4 && bh>4;i++){
    RT.bloom.push(makeRT(bw, bh, gl.RGBA16F, gl.LINEAR, 1));
    bw = Math.max(1, bw>>1); bh = Math.max(1, bh>>1);
  }
}

/* ---- domain box lines -------------------------------------------------- */
let boxVAO = null, boxBuf = null;
function buildBoxLines(){
  const a = SIM.boxMin, b = SIM.boxMax;
  const c = [[a[0],a[1],a[2]],[b[0],a[1],a[2]],[b[0],a[1],b[2]],[a[0],a[1],b[2]],
             [a[0],b[1],a[2]],[b[0],b[1],a[2]],[b[0],b[1],b[2]],[a[0],b[1],b[2]]];
  const e = [0,1,1,2,2,3,3,0, 4,5,5,6,6,7,7,4, 0,4,1,5,2,6,3,7];
  const arr = new Float32Array(e.length*3);
  e.forEach((idx,i)=>{ arr[i*3]=c[idx][0]; arr[i*3+1]=c[idx][1]; arr[i*3+2]=c[idx][2]; });
  if(!boxVAO){ boxVAO = gl.createVertexArray(); boxBuf = gl.createBuffer(); }
  gl.bindVertexArray(boxVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, boxBuf);
  gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
}

/* ==========================================================================
   IMPULSES — what the tools inject into the fields
   ========================================================================== */
const IMP = [];               // {pos(world), r(world), strength, temp, type, vel, life, decay}
const IMP_TYPE = { ignite:0, blast:1, wind:2, vortex:3, cool:4 };
function addImpulse(o){
  IMP.push(Object.assign({ r:0.35, strength:1, temp:1.8, type:0, vel:v3(0,0,0), life:0.06, decay:1 }, o));
  if(IMP.length > 24) IMP.shift();
}
const impPos = new Float32Array(12), impVel = new Float32Array(12), impPar = new Float32Array(16);
function packImpulses(){
  impPos.fill(0); impVel.fill(0); impPar.fill(0);
  // strongest first, four slots
  const act = IMP.filter(i=>i.life>0).sort((a,b)=>b.strength-a.strength).slice(0,4);
  act.forEach((im,i)=>{
    const g = worldToVoxel(im.pos);
    impPos[i*3]=g[0]; impPos[i*3+1]=g[1]; impPos[i*3+2]=g[2];
    impVel[i*3]=im.vel[0]; impVel[i*3+1]=im.vel[1]; impVel[i*3+2]=im.vel[2];
    impPar[i*4]   = im.r / SIM.cell;
    impPar[i*4+1] = im.strength;
    impPar[i*4+2] = im.temp;
    impPar[i*4+3] = im.type;
  });
  return act.length;
}
function worldToVoxel(p){
  return v3((p[0]-SIM.boxMin[0])/SIM.cell, (p[1]-SIM.boxMin[1])/SIM.cell, (p[2]-SIM.boxMin[2])/SIM.cell);
}
function ageImpulses(dt){
  for(let i=IMP.length-1;i>=0;i--){
    IMP[i].life -= dt;
    IMP[i].strength *= Math.pow(IMP[i].decay, dt*60);
    if(IMP[i].life<=0) IMP.splice(i,1);
  }
}

/* ==========================================================================
   SOLVER STEP
   ========================================================================== */
function emitterWorld(){
  return v3(0, SIM.boxMin[1] + V.emitY*SIM.h, 0);
}
function simStep(dt){
  const t0 = nowMs();
  const nImp = packImpulses();
  const emit = emitterWorld();
  const ev = worldToVoxel(emit);
  const eRad = Math.max(V.injectRadius * SIM.gx, 1.8);   // never smaller than the grid can resolve
  let p;

  // 1 — velocity: advect + forces
  p = PROG.vel.use(); setGrid(p);
  bindRT(RT.vel.write);
  bindTex(p,'uVel', RT.vel.read.tex, 0);
  bindTex(p,'uScal', RT.scal.read.tex, 1);
  gl.uniform1f(p.u('uDt'), dt);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1f(p.u('uBuoy'), V.buoyancy);
  gl.uniform1f(p.u('uWeight'), V.smokeWeight);
  gl.uniform1f(p.u('uAmb'), V.ambientTemp);
  gl.uniform1f(p.u('uTurb'), V.turbulence);
  gl.uniform1f(p.u('uTurbScale'), V.turbScale);
  gl.uniform1f(p.u('uTurbDrift'), V.turbDrift);
  gl.uniform1f(p.u('uDamp'), V.velDamp);
  gl.uniform1f(p.u('uGust'), V.gust);
  gl.uniform1f(p.u('uVS'), 1/SIM.cell);
  gl.uniform2f(p.u('uWind'), V.windX, V.windZ);
  gl.uniform3f(p.u('uJet'), V.jetSpeed, V.jetAngle*Math.PI/180, V.jetSpread);
  gl.uniform4f(p.u('uEmit'), ev[0], ev[1], ev[2], eRad);
  gl.uniform3fv(p.u('uImpPos'), impPos);
  gl.uniform3fv(p.u('uImpVel'), impVel);
  gl.uniform4fv(p.u('uImpParam'), impPar);
  drawQuad(); RT.vel.swap();

  // 2/3 — vorticity confinement
  if(V.vorticity > 0.001){
    p = PROG.curl.use(); setGrid(p);
    bindRT(RT.curl);
    bindTex(p,'uVel', RT.vel.read.tex, 0);
    drawQuad();

    p = PROG.vort.use(); setGrid(p);
    bindRT(RT.vel.write);
    bindTex(p,'uVel', RT.vel.read.tex, 0);
    bindTex(p,'uCurl', RT.curl.tex, 1);
    gl.uniform1f(p.u('uDt'), dt);
    gl.uniform1f(p.u('uEps'), V.vorticity);
    drawQuad(); RT.vel.swap();
  }

  // 4 — divergence
  p = PROG.div.use(); setGrid(p);
  bindRT(RT.div);
  bindTex(p,'uVel', RT.vel.read.tex, 0);
  bindTex(p,'uScal', RT.scal.read.tex, 1);
  gl.uniform1f(p.u('uExp'), V.expansion);
  drawQuad();

  // 5 — pressure (Jacobi)
  clearRT(RT.press.read, 0,0,0,0);
  p = PROG.jacobi.use(); setGrid(p);
  const iters = Math.max(2, Math.round(V.pressIters));
  for(let i=0;i<iters;i++){
    bindRT(RT.press.write);
    bindTex(p,'uPress', RT.press.read.tex, 0);
    bindTex(p,'uDiv', RT.div.tex, 1);
    drawQuad(); RT.press.swap();
  }

  // 6 — projection
  p = PROG.proj.use(); setGrid(p);
  bindRT(RT.vel.write);
  bindTex(p,'uVel', RT.vel.read.tex, 0);
  bindTex(p,'uPress', RT.press.read.tex, 1);
  drawQuad(); RT.vel.swap();

  // 7 — scalars: advect (MacCormack) + combustion + injection
  const mac = V.macCormack ? 1 : 0;
  if(mac){
    p = PROG.scal.use(); setGrid(p);
    bindRT(RT.hat);
    bindTex(p,'uVel', RT.vel.read.tex, 0);
    bindTex(p,'uScal', RT.scal.read.tex, 1);
    bindTex(p,'uHat', RT.scal.read.tex, 2);   // unused in mode 0; never bind the target
    gl.uniform1i(p.u('uMode'), 0);
    gl.uniform1i(p.u('uMacCormack'), 1);
    gl.uniform1f(p.u('uDt'), dt);
    drawQuad();
  }
  p = PROG.scal.use(); setGrid(p);
  bindRT(RT.scal.write);
  bindTex(p,'uVel', RT.vel.read.tex, 0);
  bindTex(p,'uScal', RT.scal.read.tex, 1);
  bindTex(p,'uHat', RT.hat.tex, 2);
  gl.uniform1i(p.u('uMode'), 1);
  gl.uniform1i(p.u('uMacCormack'), mac);
  gl.uniform1f(p.u('uDt'), dt);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1f(p.u('uBurn'), V.burnRate);
  gl.uniform1f(p.u('uIgn'), V.ignitionTemp);
  gl.uniform1f(p.u('uHeat'), V.heatRelease);
  gl.uniform1f(p.u('uSoot'), V.sootYield);
  gl.uniform1f(p.u('uCool'), V.cooling);
  gl.uniform1f(p.u('uAmb'), V.ambientTemp);
  gl.uniform1f(p.u('uDensDiss'), V.densityDiss);
  gl.uniform1f(p.u('uTempDiss'), V.tempDiss);
  gl.uniform1f(p.u('uInjRate'), V.injectRate);
  gl.uniform1f(p.u('uInjTemp'), V.injectTemp);
  gl.uniform1f(p.u('uTmax'), V.flameTemp);
  gl.uniform1f(p.u('uSmokeInj'), V.smokeInject);
  gl.uniform4f(p.u('uEmit'), ev[0], ev[1], ev[2], eRad);
  gl.uniform3fv(p.u('uImpPos'), impPos);
  gl.uniform3fv(p.u('uImpVel'), impVel);
  gl.uniform4fv(p.u('uImpParam'), impPar);
  drawQuad(); RT.scal.swap();

  simTime += dt;
  msSim = msSim*0.85 + (nowMs()-t0)*0.15;
}

/* ---- light transmittance volume --------------------------------------- */
function lightPass(sunDirW, firePosW, firePow){
  const p = PROG.light.use(); setGrid(p);
  bindRT(RT.light);
  bindTex(p,'uScal', RT.scal.read.tex, 0);
  // sun direction in voxel space (the grid is uniform, so it is the same direction)
  gl.uniform3f(p.u('uSunDir'), sunDirW[0], sunDirW[1], sunDirW[2]);
  const fv = worldToVoxel(firePosW);
  gl.uniform3f(p.u('uFirePos'), fv[0], fv[1], fv[2]);
  gl.uniform1f(p.u('uSigma'), V.extinction * V.shadowStrength * SIM.cell);
  gl.uniform1f(p.u('uSteps'), Math.min(40, Math.round(V.lightSteps)));
  gl.uniform1f(p.u('uFirePow'), firePow);
  drawQuad();
}

/* ---- pre-roll: advance the solver without drawing a frame -------------- */
function prerollSim(seconds){
  const dt = 1/60;
  const n = Math.min(Math.round(clamp(seconds, 0, 8)/dt), 480);
  for(let i=0;i<n;i++){
    simStep(dt);
    partStep(dt);
    ageImpulses(dt);
  }
  measure();
  return n;
}

/* ---- telemetry --------------------------------------------------------- */
const METRIC = { smoke:0, peakK:290, height:0, burn:0, speed:0, embers:0, cells:0, haze:0 };
const readBuf = new Float32Array(4);
function measure(){
  if(!RT.red || !RT.red.length) return;
  let p = PROG.reduce.use();
  let src = RT.scal.read.tex, sw = SIM.aw, sh = SIM.ah;
  for(let i=0;i<RT.red.length;i++){
    bindRT(RT.red[i]);
    bindTex(p,'uSrc', src, 0);
    gl.uniform2f(p.u('uSrcSize'), sw, sh);
    gl.uniform1i(p.u('uFirst'), i===0?1:0);
    gl.uniform3f(p.u('uGridR'), SIM.gx, SIM.gy, SIM.gz);
    gl.uniform2f(p.u('uTilesR'), SIM.tx, SIM.ty);
    drawQuad();
    src = RT.red[i].tex; sw = RT.red[i].w; sh = RT.red[i].h;
  }
  const last = RT.red[RT.red.length-1];
  bindRT(last);
  gl.readPixels(0,0,1,1, gl.RGBA, gl.FLOAT, readBuf);
  const cells = SIM.gx*SIM.gy*SIM.gz;
  METRIC.smoke  = readBuf[0]/cells*1000;
  METRIC.peakK  = readBuf[1]*1000;
  METRIC.height = readBuf[0] > 1e-4 ? clamp(readBuf[2]/readBuf[0], 0, 1) : 0;
  METRIC.burn   = readBuf[3]/cells*1000;
  METRIC.cells  = cells;

  // peak flow speed
  p = PROG.reducev.use();
  src = RT.vel.read.tex; sw = SIM.aw; sh = SIM.ah;
  for(let i=0;i<RT.red.length;i++){
    bindRT(RT.red[i]);
    bindTex(p,'uSrc', src, 0);
    gl.uniform2f(p.u('uSrcSize'), sw, sh);
    gl.uniform1i(p.u('uFirst'), i===0?1:0);
    drawQuad();
    src = RT.red[i].tex; sw = RT.red[i].w; sh = RT.red[i].h;
  }
  bindRT(RT.red[RT.red.length-1]);
  gl.readPixels(0,0,1,1, gl.RGBA, gl.FLOAT, readBuf);
  METRIC.speed = readBuf[0] * SIM.cell;          // voxels/s -> m/s
}

/* ==========================================================================
   CAMERA + ENVIRONMENT
   ========================================================================== */
const CAM = {
  yaw: 0.72, pitch: 0.12, dist: 7.0, target: v3(0, 1.5, 0),
  pos: v3(), right: v3(), up: v3(), fwd: v3(),
  shake: 0, shakeOff: v3(), goal: null
};
function frameShot(c){ CAM.goal = c ? Object.assign({}, c) : null; }
const camMat3 = new Float32Array(9);
const projM = new Float32Array(16), viewM = new Float32Array(16), vpM = new Float32Array(16);

function updateCamera(dt){
  if(CAM.goal){                                   // ease into a preset's staging
    const k = 1 - Math.exp(-dt*5.5);
    CAM.dist  = lerp(CAM.dist,  CAM.goal.dist,  k);
    CAM.yaw   = lerp(CAM.yaw,   CAM.goal.yaw,   k);
    CAM.pitch = lerp(CAM.pitch, CAM.goal.pitch, k);
    CAM.target[1] = lerp(CAM.target[1], CAM.goal.ty, k);
    CAM.target[0] = lerp(CAM.target[0], 0, k);
    CAM.target[2] = lerp(CAM.target[2], 0, k);
    if(Math.abs(CAM.dist - CAM.goal.dist) < 0.02 && Math.abs(CAM.target[1] - CAM.goal.ty) < 0.02) CAM.goal = null;
  }
  CAM.pitch = clamp(CAM.pitch, -0.45, 1.45);
  CAM.dist  = clamp(CAM.dist, 1.4, 26);
  const cp = Math.cos(CAM.pitch), sp = Math.sin(CAM.pitch);
  const off = v3(Math.cos(CAM.yaw)*cp, sp, Math.sin(CAM.yaw)*cp);
  v3add(CAM.pos, CAM.target, v3scale(v3(), off, CAM.dist));

  // blast-driven handheld shake
  CAM.shake = Math.max(0, CAM.shake - dt*1.7);
  const s = CAM.shake*CAM.shake*V.shake*0.12;
  const t = simTime*38;
  v3set(CAM.shakeOff,
    Math.sin(t*1.7)*s + Math.sin(t*3.1)*s*0.4,
    Math.cos(t*2.3)*s + Math.sin(t*4.7)*s*0.3,
    Math.sin(t*1.3+1.7)*s);
  v3add(CAM.pos, CAM.pos, CAM.shakeOff);

  v3norm(CAM.fwd, v3sub(v3(), CAM.target, CAM.pos));
  v3norm(CAM.right, v3cross(v3(), CAM.fwd, v3(0,1,0)));
  v3cross(CAM.up, CAM.right, CAM.fwd);

  camMat3[0]=CAM.right[0]; camMat3[1]=CAM.right[1]; camMat3[2]=CAM.right[2];
  camMat3[3]=CAM.up[0];    camMat3[4]=CAM.up[1];    camMat3[5]=CAM.up[2];
  camMat3[6]=CAM.fwd[0];   camMat3[7]=CAM.fwd[1];   camMat3[8]=CAM.fwd[2];

  const aspect = VIEW.rw/VIEW.rh;
  mat4Perspective(projM, V.fov*Math.PI/180, aspect, 0.03, 240);
  mat4LookAt(viewM, CAM.pos, CAM.target, v3(0,1,0));
  mat4Mul(vpM, projM, viewM);
}

                 top:[0.055,0.085,0.17], hor:[0.34,0.21,0.15], gnd:[0.035,0.030,0.028], fogc:[0.12,0.10,0.11] },
  'NIGHT':     { elev:-3, azim:210, temp:7200, sun:0.10, skyI:0.16, fog:0.016,

  'OVERCAST':  { elev:38, azim:96,  temp:6800, sun:0.55, skyI:1.5,  fog:0.05,
                 top:[0.34,0.37,0.41], hor:[0.46,0.48,0.51], gnd:[0.10,0.10,0.10], fogc:[0.42,0.44,0.47] },

  'BLUE HOUR': { elev:1,  azim:255, temp:9000, sun:0.35, skyI:0.55, fog:0.035,
                 top:[0.020,0.045,0.11], hor:[0.10,0.13,0.22], gnd:[0.015,0.018,0.026], fogc:[0.06,0.08,0.13] }
};
let SKY = ENVS['DUSK'];
function applyEnv(name){
  const e = ENVS[name] || ENVS['DUSK'];
  SKY = e;
  V.sunElev = e.elev; V.sunAzim = e.azim; V.sunTemp = e.temp;
  V.sunIntensity = e.sun; V.skyIntensity = e.skyI; V.fogDensity = e.fog;
}
function bbJS(K){
  K = clamp(K, 700, 14000);
  const t = K/100;
  let r,g,b;
  if(t<=66) r=255; else r=329.698727446*Math.pow(t-60,-0.1332047592);
  if(t<=66) g=99.4708025861*Math.log(t)-161.1195681661;
  else g=288.1221695283*Math.pow(t-60,-0.0755148492);
  if(t>=66) b=255; else if(t<=19) b=0; else b=138.5177312231*Math.log(t-10)-305.0447927307;
  r=clamp(r/255,0,1); g=clamp(g/255,0,1); b=clamp(b/255,0,1);
  r*=r; g*=g; b*=b;                                   // to linear
  const l = 0.2126*r+0.7152*g+0.0722*b || 1;
  return v3(r/l, g/l, b/l);                           // luminance-normalised
}
function sunDirection(){
  const el = V.sunElev*Math.PI/180, az = V.sunAzim*Math.PI/180;
  return v3norm(v3(), v3(Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)));
}

/* fire as a light source — power comes from the measured burn rate */
const FIRE = { pos: v3(0,0.3,0), col: v3(1,0.6,0.3), gain: 0, flick: 1, hist: new Float32Array(16), hi: 0 };
let BLAST = { pos: v3(0,0.4,0), pow: 0 };
function updateFireLight(dt){
  const burn = METRIC.burn, peak = METRIC.peakK;
  FIRE.hist[FIRE.hi = (FIRE.hi+1)&15] = burn;
  let mean = 0; for(let i=0;i<16;i++) mean += FIRE.hist[i]; mean /= 16;
  const dev = mean>1e-5 ? clamp(burn/mean, 0.5, 1.6) : 1;
  FIRE.flick = lerp(FIRE.flick, dev, 1-Math.exp(-dt*14));
  const powRaw = clamp(burn*0.12, 0, 3) + clamp((peak-900)/1600, 0, 1)*0.5;
  FIRE.gain = lerp(FIRE.gain, powRaw, 1-Math.exp(-dt*10));
  const em = emitterWorld();
  const tgt = BLAST.pow > 0.05
    ? v3(lerp(em[0],BLAST.pos[0],0.8), lerp(em[1],BLAST.pos[1],0.8), lerp(em[2],BLAST.pos[2],0.8))
    : v3(em[0], em[1] + METRIC.height*SIM.h*0.45 + 0.15, em[2]);
  FIRE.pos[0] = lerp(FIRE.pos[0], tgt[0], 1-Math.exp(-dt*6));
  FIRE.pos[1] = lerp(FIRE.pos[1], tgt[1], 1-Math.exp(-dt*6));
  FIRE.pos[2] = lerp(FIRE.pos[2], tgt[2], 1-Math.exp(-dt*6));
  const c = bbJS(clamp(METRIC.peakK*0.8, 1100, 3400));
  FIRE.col = c;
  BLAST.pow = Math.max(0, BLAST.pow - dt*2.4);
}

/* ==========================================================================
   FRAME
   ========================================================================== */
function setCamUniforms(p){
  gl.uniform3f(p.u('uCamPos'), CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  gl.uniformMatrix3fv(p.u('uCamMat'), false, camMat3);
  gl.uniform1f(p.u('uTanFov'), Math.tan(V.fov*Math.PI/360));
  gl.uniform1f(p.u('uAspect'), VIEW.rw/VIEW.rh);
}
function setSkyUniforms(p, sunDir, sunCol){
  gl.uniform3f(p.u('uSunDirW'), sunDir[0], sunDir[1], sunDir[2]);
  gl.uniform3f(p.u('uSunCol'), sunCol[0], sunCol[1], sunCol[2]);
  gl.uniform3f(p.u('uSkyTop'), SKY.top[0], SKY.top[1], SKY.top[2]);
  gl.uniform3f(p.u('uSkyHor'), SKY.hor[0], SKY.hor[1], SKY.hor[2]);
  gl.uniform3f(p.u('uSkyGnd'), SKY.gnd[0], SKY.gnd[1], SKY.gnd[2]);
  gl.uniform1f(p.u('uSkyInt'), V.skyIntensity);
  gl.uniform1f(p.u('uFogDens'), V.fogDensity);
  gl.uniform3f(p.u('uFogCol'), SKY.fogc[0], SKY.fogc[1], SKY.fogc[2]);
}
function setBoxUniforms(p){
  gl.uniform3f(p.u('uBoxMin'), SIM.boxMin[0], SIM.boxMin[1], SIM.boxMin[2]);
  gl.uniform3f(p.u('uBoxMax'), SIM.boxMax[0], SIM.boxMax[1], SIM.boxMax[2]);
}

function partStep(dt){
  const p = PROG.pUpd.use(); setGrid(p);
  bindRT(PARTS.state.write);
  bindTex(p,'uPos', PARTS.state.read.texs[0], 0);
  bindTex(p,'uVelT', PARTS.state.read.texs[1], 1);
  bindTex(p,'uFluid', RT.vel.read.tex, 2);
  bindTex(p,'uScal', RT.scal.read.tex, 3);
  setBoxUniforms(p);
  const em = emitterWorld();
  gl.uniform3f(p.u('uEmitW'), em[0], em[1], em[2]);
  gl.uniform3f(p.u('uBlastPos'), BLAST.pos[0], BLAST.pos[1], BLAST.pos[2]);
  gl.uniform1f(p.u('uDt'), dt);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1f(p.u('uFrame'), frameNo);
  gl.uniform1f(p.u('uCell'), SIM.cell);
  gl.uniform1f(p.u('uPNf'), PARTS.pn);
  gl.uniform1f(p.u('uSparkAmt'), V.sparkRate);
  gl.uniform1f(p.u('uDustAmt'), V.dustAmount);
  gl.uniform1f(p.u('uDebrisAmt'), V.debrisAmount);
  gl.uniform1f(p.u('uSparkLife'), V.sparkLife);
  gl.uniform1f(p.u('uEmitR'), V.injectRadius*SIM.w);
  gl.uniform1f(p.u('uJetSpeed'), V.jetSpeed);
  gl.uniform1f(p.u('uJetAngle'), V.jetAngle*Math.PI/180);
  gl.uniform1f(p.u('uCoupling'), V.fluidCoupling);
  gl.uniform1f(p.u('uGravity'), V.partGravity);
  gl.uniform1f(p.u('uBuoyP'), V.sparkBuoy);
  gl.uniform1f(p.u('uDragP'), V.sparkDrag);
  gl.uniform1f(p.u('uBounce'), V.bounce);
  gl.uniform1f(p.u('uAmb'), V.ambientTemp);
  gl.uniform1f(p.u('uInjTemp'), V.injectTemp);
  gl.uniform1f(p.u('uBlastPow'), BLAST.pow);
  drawQuad();
  PARTS.state.swap();
}

function render(dt){
  const t0 = nowMs();
  const sunDir = sunDirection();
  const sunCol = v3scale(v3(), bbJS(V.sunTemp), V.sunIntensity * Math.max(0, smoothstep(-4, 4, V.sunElev)));
  const fireGain = FIRE.gain * FIRE.flick * V.fireLight;

  lightPass(sunDir, FIRE.pos, clamp(FIRE.gain*0.5, 0, 4));

  const mode = ['BEAUTY','DENSITY','TEMP','VELOCITY','DIVERGENCE','LIGHT','SLICE'].indexOf(V.viewMode);
  if(mode > 0){
    const p = PROG.field.use(); setGrid(p); setCamUniforms(p); setBoxUniforms(p);
    bindScreen();
    gl.uniform2f(p.u('uRes'), canvas.width, canvas.height);
    gl.uniform1f(p.u('uAspect'), canvas.width/canvas.height);
    bindTex(p,'uScal', RT.scal.read.tex, 0);
    bindTex(p,'uVel', RT.vel.read.tex, 1);
    bindTex(p,'uDiv', RT.div.tex, 2);
    bindTex(p,'uLight', RT.light.tex, 3);
    gl.uniform1i(p.u('uMode'), mode);
    gl.uniform1f(p.u('uSliceZ'), V.sliceZ);
    gl.uniform1f(p.u('uGain'), 1.0);
    drawQuad();
    msRender = msRender*0.85 + (nowMs()-t0)*0.15;
    return;
  }

  /* --- 1. the set --------------------------------------------------- */
  let p = PROG.scene.use(); setGrid(p); setCamUniforms(p); setSkyUniforms(p, sunDir, sunCol); setBoxUniforms(p);
  bindRT(RT.scene);
  gl.uniform2f(p.u('uRes'), VIEW.rw, VIEW.rh);
  bindTex(p,'uLight', RT.light.tex, 0);
  gl.uniform3f(p.u('uFirePosW'), FIRE.pos[0], FIRE.pos[1], FIRE.pos[2]);
  gl.uniform3f(p.u('uFireCol'), FIRE.col[0], FIRE.col[1], FIRE.col[2]);
  gl.uniform1f(p.u('uFireGain'), fireGain);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1f(p.u('uSetOn'), V.setDressing ? 1 : 0);
  drawQuad();

  /* --- 2. particles into the scene buffer --------------------------- */
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.sceneColor.fbo);
  gl.viewport(0,0,VIEW.rw,VIEW.rh);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  p = PROG.pDraw.use();
  bindTex(p,'uPos', PARTS.state.read.texs[0], 0);
  bindTex(p,'uVelT', PARTS.state.read.texs[1], 1);
  bindTex(p,'uDepth', RT.sceneDepth, 2);
  gl.uniformMatrix4fv(p.u('uViewProj'), false, vpM);
  gl.uniform3f(p.u('uCamPos'), CAM.pos[0], CAM.pos[1], CAM.pos[2]);
  gl.uniform3f(p.u('uCamRight'), CAM.right[0], CAM.right[1], CAM.right[2]);
  gl.uniform3f(p.u('uCamUp'), CAM.up[0], CAM.up[1], CAM.up[2]);
  gl.uniform1f(p.u('uPNf'), PARTS.pn);
  gl.uniform1f(p.u('uSizeSpark'), V.sparkSize);
  gl.uniform1f(p.u('uStreak'), V.streak);
  gl.uniform1f(p.u('uSparkLife'), V.sparkLife);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform2f(p.u('uRes'), VIEW.rw, VIEW.rh);
  gl.uniform3f(p.u('uSunCol'), sunCol[0], sunCol[1], sunCol[2]);
  gl.uniform3f(p.u('uSkyTop'), SKY.top[0], SKY.top[1], SKY.top[2]);
  gl.uniform3f(p.u('uSkyGnd'), SKY.gnd[0], SKY.gnd[1], SKY.gnd[2]);
  gl.uniform3f(p.u('uFogCol'), SKY.fogc[0], SKY.fogc[1], SKY.fogc[2]);
  gl.uniform3f(p.u('uFireCol'), FIRE.col[0], FIRE.col[1], FIRE.col[2]);
  gl.uniform3f(p.u('uFirePosW'), FIRE.pos[0], FIRE.pos[1], FIRE.pos[2]);
  gl.uniform1f(p.u('uGlow'), V.emberGlow);
  gl.uniform1f(p.u('uFogDens'), V.fogDensity);
  gl.uniform1f(p.u('uSkyInt'), V.skyIntensity);
  gl.uniform1f(p.u('uFireGain'), fireGain);
  gl.bindVertexArray(quadVAO);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, PARTS.count);
  gl.disable(gl.BLEND);

  /* --- 3. the medium ------------------------------------------------ */
  p = PROG.volume.use(); setGrid(p); setCamUniforms(p); setSkyUniforms(p, sunDir, sunCol); setBoxUniforms(p);
  bindRT(RT.vol);
  gl.uniform2f(p.u('uRes'), VIEW.vw, VIEW.vh);
  bindTex(p,'uScal', RT.scal.read.tex, 0);
  bindTex(p,'uLight', RT.light.tex, 1);
  bindTex(p,'uDepth', RT.sceneDepth, 2);
  gl.uniform1f(p.u('uExt'), V.extinction);
  gl.uniform1f(p.u('uAlbedo'), V.albedo);
  gl.uniform1f(p.u('uPhaseG'), V.phaseG);
  gl.uniform1f(p.u('uEmisGain'), V.emissionGain);
  gl.uniform1f(p.u('uEmisT'), V.emissionTemp);
  gl.uniform1f(p.u('uSootEmis'), V.sootEmission);
  gl.uniform1f(p.u('uBBShift'), V.bbShift);
  gl.uniform1f(p.u('uSteps'), Math.min(240, Math.round(V.steps)));
  gl.uniform1f(p.u('uJitter'), V.jitter);
  gl.uniform1f(p.u('uDetail'), V.detail);
  gl.uniform1f(p.u('uDetailScale'), V.detailScale);
  gl.uniform1f(p.u('uShadowStr'), 1.0);
  gl.uniform1f(p.u('uSkyLight'), V.skyLight);
  gl.uniform1f(p.u('uFireGain'), fireGain);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1f(p.u('uFrame'), frameNo % 64);
  gl.uniform3f(p.u('uFireCol'), FIRE.col[0], FIRE.col[1], FIRE.col[2]);
  drawQuad();

  /* --- 4. composite ------------------------------------------------- */
  p = PROG.comp.use();
  bindRT(RT.comp);
  bindTex(p,'uScene', RT.scene.texs[0], 0);
  bindTex(p,'uVol', RT.vol.texs[0], 1);
  bindTex(p,'uHeat', RT.vol.texs[1], 2);
  bindTex(p,'uDepth', RT.sceneDepth, 3);
  gl.uniform2f(p.u('uRes'), VIEW.rw, VIEW.rh);
  gl.uniform2f(p.u('uVolRes'), VIEW.vw, VIEW.vh);
  gl.uniform1f(p.u('uHaze'), V.heatHaze);
  gl.uniform1f(p.u('uTime'), simTime);
  drawQuad();

  if(V.showBox){
    p = PROG.lines.use();
    bindRT(RT.comp);
    gl.uniformMatrix4fv(p.u('uViewProj'), false, vpM);
    gl.uniform3f(p.u('uColor'), 0.08, 0.3, 0.42);
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    gl.bindVertexArray(boxVAO);
    gl.drawArrays(gl.LINES, 0, 24);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(quadVAO);
  }

  /* --- 5. bloom ----------------------------------------------------- */
  if(V.bloom > 0.001 && RT.bloom.length){
    p = PROG.bPre.use();
    bindRT(RT.bloom[0]);
    bindTex(p,'uSrc', RT.comp.tex, 0);
    gl.uniform1f(p.u('uThresh'), V.bloomThresh);
    gl.uniform1f(p.u('uExposure'), V.exposure);
    drawQuad();
    p = PROG.bDown.use();
    for(let i=1;i<RT.bloom.length;i++){
      bindRT(RT.bloom[i]);
      bindTex(p,'uSrc', RT.bloom[i-1].tex, 0);
      gl.uniform2f(p.u('uTexel'), 1/RT.bloom[i-1].w, 1/RT.bloom[i-1].h);
      drawQuad();
    }
    p = PROG.bUp.use();
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
    for(let i=RT.bloom.length-1;i>0;i--){
      bindRT(RT.bloom[i-1]);
      bindTex(p,'uSrc', RT.bloom[i].tex, 0);
      gl.uniform2f(p.u('uTexel'), 1/RT.bloom[i].w, 1/RT.bloom[i].h);
      gl.uniform1f(p.u('uRadius'), 1.2);
      drawQuad();
    }
    gl.disable(gl.BLEND);
  }

  /* --- 6. grade + output ------------------------------------------- */
  p = PROG.post.use();
  const toScreen = !V.fxaa;
  if(toScreen) bindScreen(); else bindRT(RT.ldr);
  bindTex(p,'uSrc', RT.comp.tex, 0);
  bindTex(p,'uBloom', (V.bloom>0.001 && RT.bloom.length) ? RT.bloom[0].tex : RT.comp.tex, 1);
  gl.uniform1f(p.u('uExposure'), V.exposure);
  gl.uniform1f(p.u('uBloomAmt'), V.bloom>0.001 ? V.bloom : 0);
  gl.uniform1f(p.u('uChroma'), V.chroma);
  gl.uniform1f(p.u('uGrain'), V.grain);
  gl.uniform1f(p.u('uVign'), V.vignette);
  gl.uniform1f(p.u('uSat'), V.saturation);
  gl.uniform1f(p.u('uCon'), V.contrast);
  gl.uniform1f(p.u('uTime'), simTime);
  gl.uniform1i(p.u('uTonemap'), ['ACES','AGX','FILMIC','REINHARD'].indexOf(V.tonemap));
  gl.uniform2f(p.u('uRes'), toScreen?canvas.width:VIEW.rw, toScreen?canvas.height:VIEW.rh);
  drawQuad();

  if(V.fxaa){
    p = PROG.fxaa.use();
    bindScreen();
    bindTex(p,'uSrc', RT.ldr.tex, 0);
    gl.uniform2f(p.u('uRes'), VIEW.rw, VIEW.rh);
    drawQuad();
  }
  msRender = msRender*0.85 + (nowMs()-t0)*0.15;
}

/* ==========================================================================
   UI
   ========================================================================== */
const uiRefs = {};                      // key -> {el, val, sync()}
let toastTimer = 0;
function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), ms||1500);
}
function fmtVal(s, v){
  if(s.kind === 'bool') return v ? 'ON' : 'OFF';
  if(s.kind === 'seg') return v;
  const span = (s.max - s.min);
  if(s.step >= 1) return String(Math.round(v));
  if(span <= 2) return v.toFixed(3);
  if(span <= 20) return v.toFixed(2);
  return v.toFixed(1);
}
function buildUI(){
  const tabs = $('#tabs'), body = $('#sheetBody');
  const groupEls = {};
  GROUPS.forEach((g, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === 0 ? ' on' : '');
    b.textContent = g.name;
    b.onclick = () => {
      [...tabs.children].forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      Object.values(groupEls).forEach(d => d.classList.remove('on'));
      groupEls[g.id].classList.add('on');
      body.scrollTop = 0;
    };
    tabs.appendChild(b);
    const d = document.createElement('div');
    d.className = 'grp' + (i === 0 ? ' on' : '');
    d.innerHTML = '<p class="gdesc">' + g.desc + '</p>';
    groupEls[g.id] = d;
    body.appendChild(d);
  });

  SPEC.forEach(s => {
    const host = groupEls[s.g];
    if(!host) return;
    if(s.kind === 'head'){
      const h = document.createElement('h4');
      h.textContent = s.label;
      host.appendChild(h);
      return;
    }
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    if(s.kind === 'range'){
      wrap.innerHTML =
        '<div class="lab"><span class="nm"></span><span class="vl"></span></div>' +
        '<input type="range">' + (s.hint ? '<div class="hint"></div>' : '');
      wrap.querySelector('.nm').textContent = s.label;
      if(s.hint) wrap.querySelector('.hint').textContent = s.hint;
      const inp = wrap.querySelector('input'), vl = wrap.querySelector('.vl');
      inp.min = s.min; inp.max = s.max; inp.step = s.step; inp.value = V[s.k];
      vl.textContent = fmtVal(s, V[s.k]);
      inp.addEventListener('input', () => {
        V[s.k] = parseFloat(inp.value);
        vl.textContent = fmtVal(s, V[s.k]);
        onParamChange(s.k);
      });
      uiRefs[s.k] = { sync(){ inp.value = V[s.k]; vl.textContent = fmtVal(s, V[s.k]); } };
    } else if(s.kind === 'bool'){
      wrap.innerHTML = '<div class="togg"><span class="nm"></span><div class="sw"></div></div>' +
                       (s.hint ? '<div class="hint"></div>' : '');
      wrap.querySelector('.nm').textContent = s.label;
      if(s.hint) wrap.querySelector('.hint').textContent = s.hint;
      const sw = wrap.querySelector('.sw');
      const set = () => sw.classList.toggle('on', !!V[s.k]);
      set();
      sw.onclick = () => { V[s.k] = !V[s.k]; set(); onParamChange(s.k); };
      uiRefs[s.k] = { sync: set };
    } else {
      wrap.innerHTML = '<div class="lab"><span class="nm"></span><span class="vl"></span></div><div class="seg"></div>' +
                       (s.hint ? '<div class="hint"></div>' : '');
      wrap.querySelector('.nm').textContent = s.label;
      if(s.hint) wrap.querySelector('.hint').textContent = s.hint;
      const seg = wrap.querySelector('.seg'), vl = wrap.querySelector('.vl');
      const btns = s.opts.map(o => {
        const b = document.createElement('button');
        b.textContent = o;
        b.onclick = () => { V[s.k] = o; sync(); onParamChange(s.k); };
        seg.appendChild(b);
        return b;
      });
      function sync(){
        btns.forEach((b, i) => b.classList.toggle('on', s.opts[i] === V[s.k]));
        vl.textContent = '';
      }
      sync();
      uiRefs[s.k] = { sync };
    }
    host.appendChild(wrap);
  });

  // lab utilities
  const labHost = groupEls['lab'];
  const row = document.createElement('div');
  row.className = 'rowbtns';
  row.innerHTML = '<button class="btn" id="btnPreroll">PRE-ROLL 3s</button>' +
                  '<button class="btn" id="btnShare">COPY SETUP LINK</button>' +
                  '<button class="btn" id="btnDefaults">RESET ALL</button>';
  labHost.appendChild(row);
  const info = document.createElement('div');
  info.className = 'hint';
  info.style.marginTop = '10px';
  info.textContent = 'GPU: ' + RENDERER;
  labHost.appendChild(info);
  row.querySelector('#btnPreroll').onclick = () => {
    toast('PRE-ROLLING 3s OF SIMULATION…');
    setTimeout(()=>{ const n = prerollSim(3); toast('PRE-ROLLED ' + n + ' STEPS'); }, 30);
  };
  row.querySelector('#btnShare').onclick = shareLink;
  row.querySelector('#btnDefaults').onclick = () => { applyPreset(0); toast('DEFAULTS RESTORED'); };

  // presets rail
  const pr = $('#presets');
  PRESETS.forEach((ps, i) => {
    const b = document.createElement('button');
    b.className = 'pbtn';
    b.textContent = (ps.keys ? ps.keys + ' · ' : '') + ps.name;
    b.onclick = () => applyPreset(i);
    ps._el = b;
    pr.appendChild(b);
  });

  // frame graph
  const gcv = document.createElement('canvas');
  gcv.id = 'graph'; gcv.width = 104; gcv.height = 26;
  gcv.style.width = '104px'; gcv.style.height = '26px';
  $('#hud').appendChild(gcv);
  graphCtx = gcv.getContext('2d');
}
function refreshUI(){ Object.values(uiRefs).forEach(r => r.sync()); }

let pendingResize = false;
function onParamChange(k){
  if(k === 'gridRes'){ allocSim(V.gridRes); buildBoxLines(); toast('SOLVER REBUILT · ' + SIM.gx + '×' + SIM.gy + '×' + SIM.gz); }
  else if(k === 'partBudget'){ allocParts(V.partBudget); }
  else if(k === 'renderScale' || k === 'volScale'){ pendingResize = true; }
  else if(k === 'env'){ applyEnv(V.env); refreshUI(); }
  else if(k === 'ambientTemp'){ /* takes effect as the field relaxes */ }
  saveStateSoon();
}

/* ---- presets ----------------------------------------------------------- */
let activePreset = -1;
const KEEP_ON_PRESET = ['gridRes','partBudget','renderScale','volScale','fxaa','showHud','showBox','viewMode','sliceZ','adaptive','steps','lightSteps'];
function applyPreset(i, silent){
  const ps = PRESETS[i];
  SPEC.forEach(s => { if(s.k && KEEP_ON_PRESET.indexOf(s.k) < 0) V[s.k] = s.def; });
  if(ps) Object.keys(ps.v).forEach(k => { if(k in V) V[k] = ps.v[k]; });
  applyEnv(V.env);
  refreshUI();
  resetFields();
  IMP.length = 0;
  BLAST.pow = 0;
  activePreset = ps ? i : -1;
  PRESETS.forEach(p => p._el && p._el.classList.toggle('on', p === ps));
  if(ps && ps.action){
    setTimeout(() => {
      if(ps.action === 'blast') doBlast(v3(0, SIM.h*0.18, 0), 1.0);
      if(ps.action === 'nuke')  doBlast(v3(0, SIM.h*0.12, 0), 2.2);
      if(ps.action === 'flash') doBlast(v3(0, SIM.h*0.25, 0), 0.5);
    }, 90);
  }
  if(ps && ps.cam) frameShot(ps.cam);
  if(V.adaptive) applyQual(qualIdx);
  if(!silent && ps) toast(ps.name);
  saveStateSoon();
}

/* ---- persistence / sharing -------------------------------------------- */
let saveTimer = 0;
function saveStateSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveState, 500); }
function serialize(){
  const o = {};
  SPEC.forEach(s => { if(s.k) o[s.k] = V[s.k]; });
  return o;
}
function applySerialized(o){
  if(!o) return false;
  let n = 0;
  Object.keys(o).forEach(k => { if(k in V && typeof o[k] === typeof V[k]){ V[k] = o[k]; n++; } });
  return n > 0;
}
function saveState(){
  try{ localStorage.setItem('vfxlab_state', JSON.stringify(serialize())); }catch(e){}
}
function shareLink(){
  const s = btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));
  const url = location.origin + location.pathname + '#p=' + s;
  const done = () => toast('LINK COPIED TO CLIPBOARD');
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, () => { location.hash = 'p=' + s; toast('LINK IN ADDRESS BAR'); });
  else { location.hash = 'p=' + s; toast('LINK IN ADDRESS BAR'); }
}
function loadFromHash(){
  const m = /[#&]p=([^&]+)/.exec(location.hash || '');
  if(!m) return false;
  try{ return applySerialized(JSON.parse(decodeURIComponent(escape(atob(m[1]))))); }catch(e){ return false; }
}

/* ==========================================================================
   TOOLS + INPUT
   ========================================================================== */
let tool = 'ignite';
function pickPoint(nx, ny){
  // nx, ny in [0,1] with y up — same convention as the shaders
  const tanF = Math.tan(V.fov*Math.PI/360);
  const aspect = VIEW.rw/VIEW.rh;
  const sx = (nx*2-1)*tanF*aspect, sy = (ny*2-1)*tanF;
  const rd = v3norm(v3(),
    v3(CAM.right[0]*sx + CAM.up[0]*sy + CAM.fwd[0],
       CAM.right[1]*sx + CAM.up[1]*sy + CAM.fwd[1],
       CAM.right[2]*sx + CAM.up[2]*sy + CAM.fwd[2]));
  const planeY = SIM.boxMin[1] + V.emitY*SIM.h + 0.02;
  let t = Math.abs(rd[1]) > 1e-4 ? (planeY - CAM.pos[1])/rd[1] : -1;
  if(t < 0.1 || t > 60) t = clamp(CAM.dist*0.9, 0.5, 40);
  const p = v3(CAM.pos[0]+rd[0]*t, CAM.pos[1]+rd[1]*t, CAM.pos[2]+rd[2]*t);
  const pad = SIM.cell*3;
  p[0] = clamp(p[0], SIM.boxMin[0]+pad, SIM.boxMax[0]-pad);
  p[1] = clamp(p[1], SIM.boxMin[1]+pad, SIM.boxMax[1]-pad);
  p[2] = clamp(p[2], SIM.boxMin[2]+pad, SIM.boxMax[2]-pad);
  return p;
}
function doBlast(pos, power){
  addImpulse({ pos, r: 0.32 + 0.5*power, strength: 2.2*power, temp: 2.9 + 0.5*power,
               vel: v3(16*power + 8, 0, 0),          // radial gas speed, m/s
               type: IMP_TYPE.blast, life: 0.06 + 0.03*power, decay: 0.9 });
  BLAST.pos = pos; BLAST.pow = Math.max(BLAST.pow, power);
  CAM.shake = Math.min(2.2, CAM.shake + 1.1*power);
}
function applyTool(nx, ny, drag, continuous){
  const p = pickPoint(nx, ny);
  const life = continuous ? 1/30 : 0.2;
  if(tool === 'ignite'){
    addImpulse({ pos:p, r: V.injectRadius*SIM.w*1.1 + 0.1, strength: continuous?1.1:1.8,
                 temp: Math.max(V.injectTemp, V.ignitionTemp+0.4), type: IMP_TYPE.ignite, life });
  } else if(tool === 'blast'){
    if(!continuous) doBlast(p, 1.0);
  } else if(tool === 'wind'){
    const d = v3(CAM.right[0]*drag[0] + CAM.up[0]*drag[1],
                 CAM.right[1]*drag[0] + CAM.up[1]*drag[1],
                 CAM.right[2]*drag[0] + CAM.up[2]*drag[1]);
    const l = v3len(d);
    const speed = clamp(l*90, 1.5, 24);              // m/s from the drag rate
    addImpulse({ pos:p, r: 0.9, strength: 1, vel: v3scale(v3(), v3norm(v3(), l>1e-5?d:CAM.right), speed),
                 type: IMP_TYPE.wind, life: 1/24 });
  } else if(tool === 'vortex'){
    addImpulse({ pos:p, r: 0.85, strength: 2.2, vel: v3(7,0,0),
                 type: IMP_TYPE.vortex, life: continuous?1/24:0.5 });
  } else if(tool === 'cool'){
    addImpulse({ pos:p, r: 0.8, strength: 2.0, type: IMP_TYPE.cool, life: 1/24 });
  }
}

const ptrs = new Map();
let gesture = null, downT = 0, downPos = null, lastPos = null, movedDist = 0, pinchD = 0, paintUV = null, paintDrag = v3(0,0,0);
function canvasNorm(e){
  const r = canvas.getBoundingClientRect();
  return [ (e.clientX - r.left)/r.width, 1 - (e.clientY - r.top)/r.height ];
}
function bindInput(){
  canvas.style.touchAction = 'none';
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, canvasNorm(e));
    if(ptrs.size === 1){
      downT = nowMs(); movedDist = 0;
      downPos = canvasNorm(e); lastPos = downPos.slice();
      gesture = (e.button === 2 || e.shiftKey) ? 'paint' : 'undecided';
      if(gesture === 'paint'){ paintUV = downPos.slice(); v3set(paintDrag,0,0,0); }
    } else if(ptrs.size === 2){
      const p = [...ptrs.values()];
      pinchD = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
      gesture = 'pinch';
    }
    e.preventDefault();
  }, {passive:false});

  canvas.addEventListener('pointermove', e => {
    if(!ptrs.has(e.pointerId)) return;
    const n = canvasNorm(e);
    const prev = ptrs.get(e.pointerId);
    ptrs.set(e.pointerId, n);
    if(gesture === 'pinch' && ptrs.size >= 2){
      const p = [...ptrs.values()];
      const d = Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
      if(pinchD > 1e-4) CAM.dist *= clamp(pinchD/Math.max(d,1e-4), 0.85, 1.18);
      pinchD = d;
      const dy = n[1]-prev[1], dx = n[0]-prev[0];
      CAM.target[1] = clamp(CAM.target[1] - dy*CAM.dist*0.6, 0.05, SIM.h*1.2);
      const rx = v3scale(v3(), CAM.right, -dx*CAM.dist*0.5);
      CAM.target[0] = clamp(CAM.target[0] + rx[0], -8, 8);
      CAM.target[2] = clamp(CAM.target[2] + rx[2], -8, 8);
      return;
    }
    const dx = n[0]-lastPos[0], dy = n[1]-lastPos[1];
    movedDist += Math.hypot(dx, dy);
    if(gesture === 'undecided'){
      if(movedDist > 0.02) gesture = 'orbit';
      else if(nowMs()-downT > 230){ gesture = 'paint'; paintUV = n.slice(); v3set(paintDrag,0,0,0); }
    }
    if(gesture === 'orbit'){
      CAM.goal = null;
      CAM.yaw   -= dx*3.4;
      CAM.pitch += dy*2.6;
    } else if(gesture === 'paint'){
      paintUV = n.slice();
      paintDrag[0] = lerp(paintDrag[0], dx, 0.4);
      paintDrag[1] = lerp(paintDrag[1], dy, 0.4);
    }
    lastPos = n;
  }, {passive:false});

  const up = e => {
    if(ptrs.has(e.pointerId)) ptrs.delete(e.pointerId);
    if(ptrs.size === 0){
      if(gesture === 'undecided' && nowMs()-downT < 260 && movedDist < 0.02){
        applyTool(downPos[0], downPos[1], [0,0], false);
      }
      gesture = null; paintUV = null;
    } else if(ptrs.size === 1){
      gesture = 'orbit';
      lastPos = [...ptrs.values()][0];
    }
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('wheel', e => {
    CAM.goal = null;
    CAM.dist *= Math.exp(clamp(e.deltaY, -220, 220)*0.0013);
    e.preventDefault();
  }, {passive:false});

  // tool cluster
  document.querySelectorAll('.tool').forEach(b => {
    b.onclick = () => {
      tool = b.dataset.tool;
      document.querySelectorAll('.tool').forEach(o => o.classList.toggle('on', o === b));
      toast(tool.toUpperCase() + (tool==='blast' ? ' · TAP THE SET' : ' · TAP OR HOLD'));
    };
  });

  // chrome
  const sheet = $('#sheet');
  const togglePanel = () => {
    const open = sheet.classList.toggle('open');
    document.body.classList.toggle('panelopen', open);
    $('#btnPanel').classList.toggle('on', open);
  };
  $('#btnPanel').onclick = togglePanel;
  $('#btnSheetClose').onclick = togglePanel;
  $('#btnPause').onclick = () => {
    paused = !paused;
    $('#btnPause').classList.toggle('on', paused);
    $('#btnPause').textContent = paused ? '▶' : '❙❙';
  };
  $('#btnStep').onclick = () => { stepOnce = true; paused = true; $('#btnPause').classList.add('on'); $('#btnPause').textContent='▶'; };
  $('#btnReset').onclick = () => { resetFields(); IMP.length=0; BLAST.pow=0; toast('FIELDS CLEARED'); };
  $('#btnShot').onclick = capturePNG;
  $('#btnRec').onclick = toggleRecord;
  $('#btnDirector').onclick = toggleDirector;
  $('#btnCloseBrief').onclick = toggleDirector;
  $('#btnTake').onclick = startTake;
  $('#btnNextShot').onclick = () => { DIR.idx = (DIR.idx+1) % BRIEFS.length; showBrief(); };

  window.addEventListener('keydown', e => {
    if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    const k = e.key.toLowerCase();
    if(k === ' '){ $('#btnPause').click(); e.preventDefault(); }
    else if(k === 'r') $('#btnReset').click();
    else if(k === 'f') doBlast(v3(0, SIM.h*0.2, 0), 1.0);
    else if(k === 'p') togglePanel();
    else if(k === 'c') capturePNG();
    else if(k === 'd') toggleDirector();
    else if(k === 'h'){ $('#ui').classList.toggle('hidden'); }
    else if(k === 'arrowleft') CAM.yaw -= 0.08;
    else if(k === 'arrowright') CAM.yaw += 0.08;
    else if(k === 'arrowup') CAM.pitch += 0.05;
    else if(k === 'arrowdown') CAM.pitch -= 0.05;
    else {
      const i = PRESETS.findIndex(p => p.keys === k);
      if(i >= 0) applyPreset(i);
    }
  });

  let rt = 0;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(()=>{ pendingResize = true; }, 120); });
  window.addEventListener('orientationchange', () => { pendingResize = true; });
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); fatal('WebGL context lost — reload the page.'); });
}

/* ---- capture ----------------------------------------------------------- */
function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
}
function capturePNG(){
  canvas.toBlob(b => { if(b){ download(b, 'vfxlab-'+stamp()+'.png'); toast('FRAME SAVED'); } }, 'image/png');
}
let recorder = null;
function toggleRecord(){
  const btn = $('#btnRec');
  if(recorder){
    recorder.stop();
    return;
  }
  if(!window.MediaRecorder || !canvas.captureStream){ toast('RECORDING UNSUPPORTED HERE'); return; }
  try{
    const stream = canvas.captureStream(60);
    const types = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    const mt = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    recorder = new MediaRecorder(stream, mt ? {mimeType:mt, videoBitsPerSecond: 12000000} : undefined);
    const chunks = [];
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      download(new Blob(chunks, {type:'video/webm'}), 'vfxlab-'+stamp()+'.webm');
      recorder = null;
      btn.classList.remove('rec'); btn.textContent = '●';
      toast('TAKE SAVED');
    };
    recorder.start();
    btn.classList.add('rec'); btn.textContent = '■';
    toast('RECORDING — TAP AGAIN TO STOP');
  }catch(err){ toast('RECORD FAILED: '+err.message); recorder = null; }
}

/* ==========================================================================
   QUALITY — pick a sane rung at boot, then hold the frame rate
   ========================================================================== */
const QUAL = [
  { renderScale:'0.5',  volScale:'0.4',  steps:36,  lightSteps:6,  pressIters:12 },
  { renderScale:'0.65', volScale:'0.4',  steps:44,  lightSteps:8,  pressIters:16 },
  { renderScale:'0.65', volScale:'0.55', steps:56,  lightSteps:8,  pressIters:18 },
  { renderScale:'0.8',  volScale:'0.55', steps:72,  lightSteps:10, pressIters:22 },
  { renderScale:'0.8',  volScale:'0.7',  steps:88,  lightSteps:12, pressIters:24 },
  { renderScale:'1',    volScale:'0.7',  steps:104, lightSteps:14, pressIters:28 },
  { renderScale:'1',    volScale:'1',    steps:132, lightSteps:16, pressIters:32 }
];
let qualIdx = 4, qualCeil = 4, slowT = 0, fastT = 0, adaptCool = 0;
function applyQual(i, why){
  qualIdx = clamp(i, 0, QUAL.length-1);
  const q = QUAL[qualIdx];
  if(q.renderScale !== V.renderScale || q.volScale !== V.volScale) pendingResize = true;
  Object.keys(q).forEach(k => V[k] = q[k]);
  refreshUI();
  if(why) toast('ADAPTIVE · QUALITY ' + (qualIdx+1) + '/' + QUAL.length + ' · ' + why);
}
function autoQuality(){
  const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || window.innerWidth < 820;
  const cores = navigator.hardwareConcurrency || 4;
  let i = coarse ? 2 : 4;
  if(!coarse && cores >= 8) i = 5;
  if(coarse && cores <= 4) i = 1;
  V.gridRes = coarse ? 'LOW' : 'MED';
  V.partBudget = coarse ? '16K' : '64K';
  qualCeil = i;
  applyQual(i);
}
function adaptQuality(dt){
  if(!V.adaptive){ slowT = fastT = 0; return; }
  adaptCool -= dt;
  if(dtSmooth > 0.048) slowT += dt; else slowT = Math.max(0, slowT - dt*0.6);
  if(dtSmooth < 0.0165) fastT += dt; else fastT = 0;
  if(slowT > 1.5 && adaptCool <= 0 && qualIdx > 0){
    applyQual(qualIdx-1, 'holding frame rate'); slowT = 0; adaptCool = 3.5;
  } else if(fastT > 7 && adaptCool <= 0 && qualIdx < qualCeil){
    applyQual(qualIdx+1, 'spare headroom'); fastT = 0; adaptCool = 5;
  }
}

/* ==========================================================================
   DIRECTOR MODE — the game layer. A brief, a take, a score.
   ========================================================================== */
const DIR = { on:false, idx:0, taking:false, t:0, dur:3.2, samples:[], best:{} };
try{ DIR.best = JSON.parse(localStorage.getItem('vfxlab_best') || '{}') || {}; }catch(e){ DIR.best = {}; }

function currentStats(){
  const embers = Math.round(PARTS.count * 0.625 * V.sparkRate);
  return { peakK:METRIC.peakK, smoke:METRIC.smoke, height:METRIC.height, speed:METRIC.speed,
           sparks:V.sparkRate, embers, haze:V.heatHaze, albedo:V.albedo, debris:V.debrisAmount, burn:METRIC.burn };
}
const AGG_MAX = { peakK:1, height:1, speed:1 };
function aggregate(samples){
  const out = {};
  if(!samples.length) return currentStats();
  Object.keys(samples[0]).forEach(k => {
    if(AGG_MAX[k]) out[k] = samples.reduce((a,s)=>Math.max(a,s[k]), -1e9);
    else out[k] = samples.reduce((a,s)=>a+s[k], 0)/samples.length;
  });
  return out;
}
function goalScore(g, v){
  if(v >= g.lo && v <= g.hi) return 1;
  const width = Math.max(g.hi - g.lo, Math.abs(g.hi) * 0.25, 1e-3);
  const d = v < g.lo ? g.lo - v : v - g.hi;
  return Math.exp(-Math.pow(d/(0.8*width), 2));
}
function fmtGoal(g, v){
  if(g.fmt === 'pct') return Math.round(v*100) + '% / ' + Math.round(g.lo*100) + '–' + Math.round(g.hi*100) + '%';
  const r = x => Math.abs(x) >= 100 ? Math.round(x) : (Math.abs(x) >= 10 ? x.toFixed(1) : x.toFixed(2));
  return r(v) + ' / ' + r(g.lo) + '–' + r(g.hi) + (g.unit ? ' ' + g.unit : '');
}
function showBrief(){
  const b = BRIEFS[DIR.idx];
  $('#briefTag').textContent = 'SHOT ' + String(DIR.idx+1).padStart(2,'0') + ' / ' + BRIEFS.length +
    (DIR.best[b.name] ? '  ·  BEST ' + DIR.best[b.name].pct + '%' : '');
  $('#briefName').textContent = b.name;
  $('#briefText').textContent = b.text;
  const host = $('#goals');
  host.innerHTML = '';
  b.goals.forEach((g,i) => {
    const d = document.createElement('div');
    d.className = 'goal';
    d.innerHTML = '<span class="gn"></span><span class="gv mono"></span><span class="bar"><i></i></span>';
    d.querySelector('.gn').textContent = g.label;
    host.appendChild(d);
    g._el = d;
  });
  $('#score').textContent = DIR.taking ? 'RECORDING TAKE…' : 'LIVE — TUNE THE RIG, THEN TAKE';
  $('#stars').textContent = DIR.best[b.name] ? '★'.repeat(DIR.best[b.name].stars) + '☆'.repeat(3-DIR.best[b.name].stars) : '';
  updateGoals();
}
function updateGoals(stats){
  if(!DIR.on) return;
  const b = BRIEFS[DIR.idx];
  const s = stats || currentStats();
  b.goals.forEach(g => {
    if(!g._el) return;
    const v = s[g.m] || 0;
    const sc = goalScore(g, v);
    g._el.querySelector('.gv').textContent = fmtGoal(g, v);
    g._el.querySelector('.bar i').style.width = Math.round(sc*100) + '%';
    g._el.classList.toggle('ok', sc >= 0.999);
  });
}
function toggleDirector(){
  DIR.on = !DIR.on;
  $('#brief').classList.toggle('show', DIR.on);
  $('#btnDirector').classList.toggle('on', DIR.on);
  document.body.classList.toggle('briefopen', DIR.on);
  if(DIR.on) showBrief();
  else DIR.taking = false;
}
function startTake(){
  if(!DIR.on) return;
  DIR.taking = true; DIR.t = 0; DIR.samples = [];
  $('#score').textContent = 'RECORDING TAKE…';
  $('#btnTake').classList.add('on');
  toast('TAKE ROLLING · ' + DIR.dur.toFixed(1) + 's');
}
function tickTake(dt){
  DIR.t += dt;
  if(frameNo % 6 === 0) DIR.samples.push(currentStats());
  if(DIR.t >= DIR.dur){
    DIR.taking = false;
    $('#btnTake').classList.remove('on');
    const b = BRIEFS[DIR.idx];
    const agg = aggregate(DIR.samples);
    let total = 0;
    b.goals.forEach(g => total += goalScore(g, agg[g.m] || 0));
    const pct = Math.round(total/b.goals.length*100);
    const stars = pct >= 90 ? 3 : (pct >= 72 ? 2 : (pct >= 50 ? 1 : 0));
    updateGoals(agg);
    const prev = DIR.best[b.name];
    if(!prev || pct > prev.pct){
      DIR.best[b.name] = { pct, stars };
      try{ localStorage.setItem('vfxlab_best', JSON.stringify(DIR.best)); }catch(e){}
      $('#score').textContent = 'NEW BEST · ' + pct + '%';
    } else {
      $('#score').textContent = 'TAKE SCORED ' + pct + '% (BEST ' + prev.pct + '%)';
    }
    $('#stars').textContent = '★'.repeat(stars) + '☆'.repeat(3-stars);
    toast(stars ? ('PRINT IT · ' + '★'.repeat(stars) + ' ' + pct + '%') : ('NO GOOD · ' + pct + '% — ADJUST AND RE-TAKE'), 2600);
  }
}

let graphCtx = null;
const ftHist = new Float32Array(52);
let ftHi = 0, hudTimer = 0;
function updateHUD(dtMs){
  ftHist[ftHi = (ftHi+1) % ftHist.length] = dtMs;
  const hud = $('#hud');
  if(!V.showHud){ hud.style.visibility = 'hidden'; return; }
  hud.style.visibility = 'visible';
  if(nowMs() - hudTimer < 120) return;
  hudTimer = nowMs();
  const fps = 1000/Math.max(dtSmooth*1000, 0.01);
  const kk = (METRIC.peakK/1000).toFixed(2);
  const rows = [
    '<b>'+fps.toFixed(0)+' FPS</b> <span class="k">·</span> <b>'+(dtSmooth*1000).toFixed(1)+' ms</b>'+
      ' <span class="k">cpu sim</span> '+msSim.toFixed(1)+' <span class="k">cpu gfx</span> '+msRender.toFixed(1),
    '<span class="k">GRID</span> '+SIM.gx+'×'+SIM.gy+'×'+SIM.gz+' <span class="k">=</span> '+
      (METRIC.cells/1000).toFixed(0)+'k <span class="k">VOX</span>'+
      ' <span class="k">·</span> '+(PARTS.count/1000).toFixed(0)+'k <span class="k">PRT</span>',
    '<span class="k">PEAK</span> <span class="w">'+Math.round(METRIC.peakK)+' K</span>'+
      ' <span class="k">('+kk+' kK)</span>',
    '<span class="k">SOOT</span> <span class="v">'+METRIC.smoke.toFixed(2)+'</span>'+
      ' <span class="k">PLUME</span> <span class="v">'+Math.round(METRIC.height*100)+'%</span>',
    '<span class="k">FLOW</span> <span class="v">'+METRIC.speed.toFixed(1)+'</span> m/s'+
      ' <span class="k">BURN</span> <span class="v">'+METRIC.burn.toFixed(2)+'</span>',
    '<span class="k">LIGHT</span> <span class="w">'+(FIRE.gain*FIRE.flick).toFixed(2)+'</span>'+
      ' <span class="k">IMP</span> '+IMP.length+
      ' <span class="k">VOL</span> '+VIEW.vw+'×'+VIEW.vh
  ];
  const gcv = graphCtx ? graphCtx.canvas : null;
  hud.innerHTML = rows.join('<br>');
  if(gcv) hud.appendChild(gcv);

  if(graphCtx){
    const c = graphCtx, w = c.canvas.width, h = c.canvas.height;
    c.clearRect(0,0,w,h);
    c.fillStyle = 'rgba(8,12,17,0.72)'; c.fillRect(0,0,w,h);
    c.strokeStyle = 'rgba(78,201,255,0.22)';
    c.beginPath(); c.moveTo(0, h-16.7/50*h); c.lineTo(w, h-16.7/50*h); c.stroke();  // 60fps line
    c.strokeStyle = '#4ec9ff'; c.lineWidth = 1; c.beginPath();
    for(let i=0;i<ftHist.length;i++){
      const idx = (ftHi+1+i) % ftHist.length;
      const x = i/(ftHist.length-1)*w;
      const y = h - clamp(ftHist[idx]/50, 0, 1)*h;
      i ? c.lineTo(x,y) : c.moveTo(x,y);
    }
    c.stroke();
  }
}

/* ==========================================================================
   MAIN LOOP
   ========================================================================== */
let lastT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lastT) lastT = ts;
  const dtRaw = Math.max((ts - lastT)/1000, 0.0002);
  const dtReal = Math.min(dtRaw, 0.25);
  lastT = ts;
  dtSmooth = lerp(dtSmooth, dtRaw, 0.12);

  if(pendingResize){ pendingResize = false; allocScreen(); }

  // continuous tool painting
  if(gesture === 'paint' && paintUV) applyTool(paintUV[0], paintUV[1], paintDrag, true);

  updateCamera(dtReal);

  if(!paused || stepOnce){
    const sub = Math.max(1, Math.round(V.substeps));
    const dt = Math.min(dtReal, 1/30) * V.timeScale / sub;
    for(let i=0;i<sub;i++){
      simStep(dt);
      partStep(dt);
    }
    ageImpulses(dtReal);
    stepOnce = false;
  }

  if(frameNo % 6 === 0){
    measure();
    if(DIR.on && !DIR.taking) updateGoals();
  }
  updateFireLight(dtReal);
  adaptQuality(dtRaw);
  render(dtReal);
  if(DIR.taking) tickTake(dtReal);
  updateHUD(dtRaw*1000);
  frameNo++;
}

function init(){
  try{
    bootMsg.textContent = 'COMPILING ' + 21 + ' SHADER PROGRAMS…';
    setupPrograms();
  }catch(err){
    fatal('Shader build failed.\n\n' + (shaderLog.join('\n\n') || err.message));
    return;
  }
  try{
    const restored = loadFromHash() || (function(){
      try{ return applySerialized(JSON.parse(localStorage.getItem('vfxlab_state') || 'null')); }catch(e){ return false; }
    })();

    if(!restored) autoQuality();
    applyEnv(V.env);
    allocSim(V.gridRes);
    allocParts(V.partBudget);
    allocScreen();
    buildBoxLines();
    buildUI();
    bindInput();
    refreshUI();
    if(!restored) applyPreset(0, true);
    else { resetFields(); toast('SETUP RESTORED'); }

    bootEl.classList.add('gone');
    requestAnimationFrame(loop);
    setTimeout(()=>{
      if(!restored) toast('TAP THE GROUND TO IGNITE · DRAG TO ORBIT · ≡ FOR THE RIG', 3800);
    }, 700);
  }catch(err){
    fatal('Initialisation failed.\n\n' + (err && err.stack ? err.stack : String(err)));
  }
}
/* console handle — the lab is meant to be poked at from devtools */
window.VFXLAB = {
  V, SPEC, PRESETS, BRIEFS, PROG, METRIC, CAM, IMP, DIR,
  get sim(){ return SIM; }, get parts(){ return PARTS; }, get view(){ return VIEW; },
  get frame(){ return frameNo; }, get shaderLog(){ return shaderLog; },
  set(k, v){ if(k in V){ V[k] = v; onParamChange(k); refreshUI(); } return V[k]; },
  preset(i){ applyPreset(i); },
  blast(power){ doBlast(v3(0, SIM.h*0.2, 0), power || 1); },
  reset: resetFields, spin: prerollSim, frameShot,
  pause(p){ paused = (p === undefined) ? !paused : !!p; return paused; },
  stats: currentStats
};
init();
</script>
